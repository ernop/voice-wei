<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Games - Voice-Wei</title>
    <link rel="stylesheet" href="style.css?v=379">
    <link rel="stylesheet" href="practice-controls.css?v=379">
    <link rel="stylesheet" href="games.css?v=379">
</head>

<body data-page="games">
    <div class="container">
        <header id="siteHeader"></header>

        <main>
            <section class="find-panel" id="findPanel">
                <div class="find-top">
                    <div class="find-intro">
                        <h2>Find</h2>
                        <p class="find-lead">Top line first. One point per match.</p>
                        <button id="findClear" class="secondary-btn find-clear" type="button">Clear letters</button>
                    </div>
                    <div class="find-score-block">
                        <div class="find-score-caption">Score</div>
                        <div class="find-score" id="findScore" aria-live="polite">0</div>
                    </div>
                </div>
                <div class="find-puzzles vf-compact" id="findPuzzles"></div>
                <div class="find-board" id="findBoard">
                    <div class="find-constraints" id="findConstraints"></div>
                    <div class="find-gutter"></div>
                    <div class="find-slots" id="findSlots"></div>
                    <svg class="find-lines" id="findLines" aria-hidden="true"></svg>
                </div>
            </section>
        </main>
    </div>

    <script src="dev-error-monitor.js?v=379"></script>
    <script src="fuseki-stats.js?v=379"></script>
    <script src="usage-stats.js?v=379"></script>
    <script src="app-version.js?v=379"></script>
    <script src="storage-keys.js?v=379"></script>
    <script src="settings-store.js?v=379"></script>
    <script src="shared-header.js?v=379"></script>
    <script src="find-puzzle.js?v=379"></script>
    <script src="games.js?v=379"></script>
</body>

</html>
