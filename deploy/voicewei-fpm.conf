[voicewei]
user = voicewei
group = voicewei

listen = /run/php/php8.3-fpm-voicewei.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 250

php_admin_value[open_basedir] = /srv/voice-wei/site:/tmp
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
php_admin_flag[allow_url_fopen] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /home/voicewei/php-error.log
