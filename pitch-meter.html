<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Voice-Wei: Real-time pitch detection for singers">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Pitch - Voice-Wei</title>
    <link rel="stylesheet" href="style.css?v=350">
    <link rel="stylesheet" href="practice-controls.css?v=350">
    <link rel="stylesheet" href="pitch-meter.css?v=350">
</head>

<body data-page="pitch">
    <div class="container">
        <header id="siteHeader"></header>

        <main>
            <div class="status" id="status">Loading piano...</div>

            <!-- Practice Mode Selection -->
            <div class="mode-settings">
                <div class="setting-group">
                    <span class="vf-label">Mode</span>
                    <div class="segment-row">
                        <button class="vf-btn" data-mode="free">free practice</button>
                        <button class="vf-btn" data-mode="call-response">call &amp; response</button>
                        <button class="vf-btn" data-mode="play-along">play along</button>
                    </div>
                </div>
                <div class="setting-group" id="responseTimeGroup">
                    <div class="step-field">
                        <span class="step-label">Match</span>
                        <button class="step-btn" type="button" data-step-key="responseTime" data-step-delta="-1" aria-label="Shorter match time">-</button>
                        <span class="step-value" id="responseTimeValue">2s</span>
                        <button class="step-btn" type="button" data-step-key="responseTime" data-step-delta="1" aria-label="Longer match time">+</button>
                    </div>
                </div>
            </div>

            <!-- Scale Selection -->
            <div class="pitch-settings">
                <div class="setting-group">
                    <span class="vf-label">Range</span>
                    <div class="segment-row">
                        <button class="vf-btn" data-instrument="voice">voice</button>
                        <button class="vf-btn" data-instrument="violin">violin</button>
                        <button class="vf-btn" data-instrument="bass">bass</button>
                    </div>
                </div>
                <div class="setting-group">
                    <div class="step-field">
                        <span class="step-label">Key</span>
                        <button class="step-btn" type="button" data-step-key="rootPitch" data-step-delta="-1" aria-label="Lower key">-</button>
                        <span class="step-value" id="rootPitchValue">C4</span>
                        <button class="step-btn" type="button" data-step-key="rootPitch" data-step-delta="1" aria-label="Higher key">+</button>
                    </div>
                </div>
                <div class="setting-group">
                    <span class="vf-label">Scale</span>
                    <div class="segment-row">
                        <button class="vf-btn" data-scale="major">major</button>
                        <button class="vf-btn" data-scale="minor">minor</button>
                        <button class="vf-btn" data-scale="chromatic">chromatic</button>
                        <button class="vf-btn" data-scale="pentatonic">pentatonic</button>
                        <button class="vf-btn" data-scale="blues">blues</button>
                    </div>
                </div>
            </div>

            <!-- Control Buttons -->
            <div class="pitch-controls">
                <button id="listenBtn" class="listen-button" disabled>
                    <span class="button-icon">&#127911;</span>
                    <span class="button-text">Start</span>
                </button>
                <button id="stopBtn" class="stop-button" disabled>
                    <span class="button-icon">&#9632;</span>
                    <span class="button-text">Stop</span>
                </button>
                <button id="playRefBtn" class="play-button" disabled>
                    <span class="button-icon">&#9835;</span>
                    <span class="button-text">Preview Scale</span>
                </button>
            </div>

            <!-- Real-time display -->
            <div class="pitch-display">
                <div class="current-pitch">
                    <div class="pitch-note" id="currentNote">--</div>
                    <div class="pitch-cents" id="currentCents">-- cents</div>
                    <div class="pitch-freq" id="currentFreq">-- Hz</div>
                </div>
                <div class="pitch-indicator">
                    <div class="indicator-bar">
                        <div class="indicator-marker" id="centsMarker"></div>
                        <div class="indicator-center"></div>
                    </div>
                    <div class="indicator-labels">
                        <span>-50</span>
                        <span>0</span>
                        <span>+50</span>
                    </div>
                </div>
            </div>

            <!-- Pitch Chart Canvas -->
            <div class="chart-container">
                <canvas id="pitchChart"></canvas>
            </div>

            <!-- Results Panel -->
            <div class="results-panel" id="resultsPanel" style="display: none;">
                <h3>Results</h3>
                <div class="results-summary">
                    <div class="result-item">
                        <span class="result-label">Overall Accuracy</span>
                        <span class="result-value" id="overallAccuracy">--%</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Average Deviation</span>
                        <span class="result-value" id="avgDeviation">-- cents</span>
                    </div>
                    <div class="result-item">
                        <span class="result-label">Notes Hit</span>
                        <span class="result-value" id="notesHit">0/0</span>
                    </div>
                </div>
                <div class="progress-summary" id="progressSummary"></div>
                <div class="progress-summary" id="weakSpotsSummary"></div>
                <div class="note-breakdown" id="noteBreakdown"></div>
            </div>

            <footer class="page-footer">
                <button onclick="location.reload(true)" class="footer-btn">Hard Refresh</button>
                <a href="https://github.com/ernop/voice-wei" target="_blank" class="footer-link">GitHub</a>
            </footer>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="dev-error-monitor.js?v=350"></script>
    <script src="app-version.js?v=350"></script>
    <script src="storage-keys.js?v=350"></script>
    <script src="audio-volume.js?v=350"></script>
    <script src="shared-header.js?v=350"></script>
    <script src="music-constants.js?v=350"></script>
    <script src="piano-core.js?v=350"></script>
    <script src="pitch-detect-core.js?v=350"></script>
    <script src="pitch-score.js?v=350"></script>
    <script src="pitch-trace-view.js?v=350"></script>
    <script src="render-throttle.js?v=350"></script>
    <script src="practice-controls.js?v=350"></script>
    <script src="settings-store.js?v=350"></script>
    <script src="progress-store.js?v=350"></script>
    <script src="pitch-meter.js?v=350"></script>
</body>

</html>
