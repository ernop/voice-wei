name: Deploy to Production

on:
  push:
    branches: [master]
  workflow_dispatch:  # Manual trigger button in GitHub UI

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # package-lock.json is gitignored (project choice), so install from
      # the version ranges; only typecheck/lint tooling is needed here.
      - name: Install dev tooling
        run: npm install --no-audit --no-fund

      # Static gates: typed contracts and lint guards must hold before
      # anything reaches the live site. Zero tolerated errors.
      - name: Typecheck (typed contracts)
        run: npm run typecheck

      - name: Lint (architecture guards)
        run: npm run lint

      - name: Fast browser suite
        run: npm test

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.gitignore' \
            --exclude='.cursor' \
            --exclude='.github' \
            --exclude='.ast-grep' \
            --exclude='config.json' \
            --exclude='tests' \
            --exclude='node_modules' \
            --exclude='*.md' \
            --exclude='*.txt' \
            --exclude='*.sh' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Generate deploy telemetry
        if: success()
        run: node .github/scripts/generate-deploy-telemetry.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_TELEMETRY_PAGES: 1

      - name: Upload deploy telemetry
        if: success()
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            deploy-telemetry.json ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/deploy-telemetry.json

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
