name: Deploy to Production

on:
  push:
    branches: [master]
    # Docs/rules-only pushes do not change the live site (rsync excludes them).
    paths-ignore:
      - '**.md'
      - '.cursor/**'
      - 'demos/**'
  workflow_dispatch:

# Never cancel mid-run: an aborted rsync --delete can leave a partial tree.
# Deploys are ~15s, so queued runs wait briefly instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

# Skip Playwright postinstall browser download; the validate job installs
# Chromium explicitly (and caches it).
#
# Deliberately NOT the image's hosted Chrome: the Lyrics startup gate is a
# calibrated 1000ms wall-clock contract, and system Chrome starts ~560ms
# slower here than cached Playwright Chromium (832ms vs 271ms measured on
# 2026-07-24), leaving no honest headroom.
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  # Site is live when this job finishes - no gates in front. Yui is the only
  # user and directed deploy-first (2026-07-25): agents validate locally
  # before pushing, the validate job re-checks in parallel, and a red run is
  # the fix-forward signal.
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_URL: https://fuseki.net/voice-wei/
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Secrets reach scripts as environment data, never as script text.
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Product files only: deploy/rsync-filter is the one publish list
      # (deploy.sh reads it too). check-target.sh refuses any target outside
      # a voice-wei directory before rsync --delete can run.
      - name: Deploy via rsync
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          deploy/check-target.sh "$DEPLOY_USER" "$DEPLOY_HOST" "$DEPLOY_PATH"
          rsync -avz --delete --delete-excluded --prune-empty-dirs \
            --filter='merge deploy/rsync-filter' \
            -e "ssh -i /tmp/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:${DEPLOY_PATH%/}/"

      # The live site must serve exactly the build this commit ships. This
      # step is the "live" signal.
      - name: Verify deployment
        run: deploy/verify-live.sh "$APP_URL" "$(tr -d '[:space:]' < VERSION)"

      # After the live signal: the domain owner's site is unharmed and
      # proxy.php works. A failure names the broken piece; the ship is live.
      - name: Smoke-check host site and proxy
        run: deploy/smoke-live.sh "$APP_URL"

      - name: Cleanup
        if: always()
        run: rm -f /tmp/deploy_key

  # Runs in parallel with deploy, not in front of it. A failure here means
  # the live site needs a fix-forward push now.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # package-lock.json is gitignored (project choice). Cache node_modules by
      # package.json so warm runs skip npm install entirely.
      - name: Cache node_modules
        id: npm-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package.json') }}

      - name: Install npm deps
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm install --no-audit --no-fund

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}

      # A cache hit already contains the exact package.json-pinned browser.
      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Typecheck and lint are independent readers and run together. The
      # browser suite runs AFTER them, alone: it contains the Lyrics startup
      # gate, whose 1000ms wall-clock budget is only honest on an otherwise
      # idle runner.
      - name: Typecheck and lint in parallel
        run: |
          npm run typecheck & typecheck_pid=$!
          npm run lint & lint_pid=$!
          status=0
          wait "$typecheck_pid" || status=1
          wait "$lint_pid" || status=1
          exit "$status"

      - name: Browser test suite
        run: npm test
