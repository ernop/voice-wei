name: Deploy to Production

on:
  push:
    branches: [master]
    # Docs/rules-only pushes do not change the live site (rsync excludes them).
    paths-ignore:
      - '**.md'
      - '.cursor/**'
      - 'demos/**'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

# Skip Playwright postinstall browser download; we install Chromium explicitly
# (and cache it) below.
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  # GitHub's Ubuntu image already ships current stable Chrome. The test helper
  # accepts this explicit path, so deploys need no second browser payload.
  CHROME_PATH: /usr/bin/google-chrome

jobs:
  # Gates + rsync. Site is live when this job finishes.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # package-lock.json is gitignored (project choice). Cache node_modules by
      # package.json so warm deploys skip npm install entirely.
      - name: Cache node_modules
        id: npm-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package.json') }}

      - name: Install npm deps
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm install --no-audit --no-fund

      # Typecheck and lint are independent readers and run together. The
      # browser suite runs AFTER them, alone: it contains the Lyrics startup
      # gate, whose 1000ms wall-clock budget is only honest on an otherwise
      # idle runner (tsc/ast-grep racing on the 2-core runner contaminates
      # the timing and fails deploys spuriously).
      - name: Typecheck and lint in parallel
        run: |
          npm run typecheck & typecheck_pid=$!
          npm run lint & lint_pid=$!
          status=0
          wait "$typecheck_pid" || status=1
          wait "$lint_pid" || status=1
          exit "$status"

      - name: Browser test suite
        run: npm test

      - name: Set up SSH
        run: |
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Product files only. Keep this exclude list in sync with deploy.sh.
      - name: Deploy via rsync
        run: |
          rsync -avz --delete --delete-excluded --prune-empty-dirs \
            --exclude='.git' \
            --exclude='.gitignore' \
            --exclude='.cursorignore' \
            --exclude='.cursor' \
            --exclude='.github' \
            --exclude='.ast-grep' \
            --exclude='.vscode' \
            --exclude='.dev' \
            --exclude='config.json' \
            --exclude='config.example.json' \
            --exclude='tests' \
            --exclude='types' \
            --exclude='demos' \
            --exclude='deploy' \
            --exclude='node_modules' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='*.md' \
            --exclude='*.txt' \
            --exclude='*.sh' \
            --exclude='*.py' \
            --exclude='tsconfig.json' \
            --exclude='sgconfig.yml' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='dev-server.js' \
            --exclude='pipeline-*.svg' \
            --exclude='screenshot-*.png' \
            -e "ssh -i /tmp/deploy_key -o StrictHostKeyChecking=yes" \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Verify deployment
        run: curl --fail --silent --show-error https://fuseki.net/voice-wei/VERSION

      - name: Cleanup
        if: always()
        run: rm -f /tmp/deploy_key
