name: Deploy to Production

on:
  push:
    branches: [master]
    # Docs/rules-only pushes do not change the live site (rsync excludes them).
    # Skip the full install + rsync when nothing deployable changed.
    paths-ignore:
      - '**.md'
      - '.cursor/**'
      - 'demos/**'
  workflow_dispatch:  # Manual trigger button in GitHub UI

# One deploy at a time; a newer push cancels an in-flight older one.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

# Skip Playwright postinstall browser download; the job container already
# ships Chromium matching the pinned playwright version in package.json.
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  # Gates + rsync. Site is live when this job finishes.
  # Keep the image tag in sync with package.json's playwright version.
  deploy:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # package-lock.json is gitignored (project choice). Cache node_modules by
      # package.json so warm deploys skip npm install entirely.
      - name: Cache node_modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-pw1611-${{ hashFiles('package.json') }}

      - name: Install npm deps
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm install --no-audit --no-fund

      # Static gates before anything reaches the live site. Zero tolerated errors.
      - name: Typecheck (typed contracts)
        run: npm run typecheck

      - name: Lint (architecture guards)
        run: npm run lint

      - name: Fast browser suite
        run: npm test

      - name: Install rsync and OpenSSH
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends rsync openssh-client

      - name: Set up SSH
        run: |
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      # Product files only. Keep this exclude list in sync with deploy.sh.
      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.gitignore' \
            --exclude='.cursor' \
            --exclude='.github' \
            --exclude='.ast-grep' \
            --exclude='.vscode' \
            --exclude='.dev' \
            --exclude='config.json' \
            --exclude='tests' \
            --exclude='types' \
            --exclude='demos' \
            --exclude='deploy' \
            --exclude='node_modules' \
            --exclude='*.md' \
            --exclude='*.txt' \
            --exclude='*.sh' \
            --exclude='*.py' \
            --exclude='tsconfig.json' \
            --exclude='sgconfig.yml' \
            --exclude='package.json' \
            --exclude='dev-server.js' \
            --exclude='pipeline-*.svg' \
            --exclude='screenshot-*.png' \
            -e "ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Cleanup
        if: always()
        run: rm -f /tmp/deploy_key

  # Deploys page data — after the site is already live, so it cannot delay ship.
  telemetry:
    needs: deploy
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate deploy telemetry
        run: node .github/scripts/generate-deploy-telemetry.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_TELEMETRY_PAGES: 1

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Upload deploy telemetry
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            deploy-telemetry.json ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/deploy-telemetry.json

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
