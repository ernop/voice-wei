<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Voice-Wei: scale practice for singers and musicians">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Scales - Voice-Wei</title>
    <link rel="stylesheet" href="style.css?v=378">
    <link rel="stylesheet" href="practice-controls.css?v=378">
    <link rel="stylesheet" href="piano-keyboard.css?v=378">
    <link rel="stylesheet" href="scales.css?v=378">
</head>

<body data-page="scales">
    <div class="container">
        <header id="siteHeader"></header>

        <main>
            <div class="transport-row">
                <button id="playBtn" class="play-button" aria-label="Play">
                    <span class="button-text">Play</span>
                    <span class="button-icon">&#9654;</span>
                </button>
                <button id="stopBtn" class="stop-button" aria-label="Stop playback">
                    <span class="button-text">Stop</span>
                    <span class="button-icon">&#9632;</span>
                </button>
            </div>

            <!-- The keyboard labels what the current pattern plays, plus three
                 scale notes beyond each end, with plain piano around them as
                 the width allows (piano-keyboard.js). The readout above it is
                 the page's status surface. -->
            <div class="piano-container">
                <div class="piano-readout" id="pianoReadout">
                    <span class="piano-readout-plan" id="pianoReadoutPlan"></span>
                    <span class="piano-readout-notes" id="pianoReadoutNotes"></span>
                </div>
                <div id="pianoKeyboard" role="group" aria-label="Piano keyboard"></div>
            </div>

            <!-- Scale builder: each option button both shows and sets its setting. -->
            <div class="settings-card vf-compact">
                <!-- Timing + Key steppers share one row (same cluster as Phrases). -->
                <div class="vf-row">
                    <div class="step-field">
                        <span class="step-label">Note Length</span>
                        <button class="step-btn" type="button" data-step-key="noteLengthMs" data-step-delta="-1" aria-label="Shorter note length">-</button>
                        <span class="step-value" id="noteLengthValue">0.3s</span>
                        <button class="step-btn" type="button" data-step-key="noteLengthMs" data-step-delta="1" aria-label="Longer note length">+</button>
                    </div>
                    <div class="step-field">
                        <span class="step-label">Note Gap</span>
                        <button class="step-btn" type="button" data-step-key="gapMs" data-step-delta="-1" aria-label="Smaller gap">-</button>
                        <span class="step-value" id="gapValue">0s</span>
                        <button class="step-btn" type="button" data-step-key="gapMs" data-step-delta="1" aria-label="Larger gap">+</button>
                    </div>
                    <div class="step-field">
                        <span class="step-label">Key</span>
                        <button class="step-btn" type="button" data-step-key="rootPitch" data-step-delta="-1" aria-label="Lower key">-</button>
                        <span class="step-value" id="rootPitchValue">C4</span>
                        <button class="step-btn" type="button" data-step-key="rootPitch" data-step-delta="1" aria-label="Higher key">+</button>
                    </div>
                </div>

                <!-- Shape: section width first (define the range), then how
                     you move through it. Every option group is a labeled
                     segment row; its label lives inside the shell. -->
                <div class="vf-row">
                    <div class="segment-row">
                        <span class="step-label">Section Width</span>
                        <button class="vf-btn" data-section-length="1o">1 octave</button>
                        <button class="vf-btn" data-section-length="1o+3">octave+3rd</button>
                        <button class="vf-btn" data-section-length="1o+5">octave+5th</button>
                        <button class="vf-btn" data-section-length="2o">2 octaves</button>
                    </div>
                </div>

                <div class="vf-row">
                    <div class="segment-row">
                        <span class="step-label">Direction</span>
                        <button class="vf-btn" data-direction="ascending">up</button>
                        <button class="vf-btn" data-direction="descending">down</button>
                        <button class="vf-btn" data-direction="both">up+down</button>
                        <button class="vf-btn" data-direction="down_and_up">down+up</button>
                    </div>
                </div>

                <!-- Move and Leaps set one movement style between them:
                     exactly one button across both rows is lit. -->
                <div class="vf-row">
                    <div class="segment-row">
                        <span class="step-label">Move</span>
                        <button class="vf-btn" data-movement="normal">normal</button>
                        <button class="vf-btn" data-movement="stop_and_go">+1+2</button>
                        <button class="vf-btn" data-movement="one_three_five">1-3-5</button>
                        <button class="vf-btn" data-movement="neighbors">neighbors</button>
                        <button class="vf-btn" data-movement="chords">chords</button>
                        <button class="vf-btn" data-movement="from_one">from 1</button>
                        <button class="vf-btn" data-movement="to_one">to 1</button>
                        <button class="vf-btn" data-movement="plus_minus_one">+1-1</button>
                        <button class="vf-btn" data-movement="chromatic_stop_and_go">+1+2 chrom</button>
                        <button class="vf-btn" data-movement="plus_minus_half">+1-1 chrom</button>
                    </div>
                </div>

                <div class="vf-row">
                    <div class="segment-row">
                        <span class="step-label">Leaps</span>
                        <button class="vf-btn" data-movement="third_up">3rd up</button>
                        <button class="vf-btn" data-movement="fourth_up">4th up</button>
                        <button class="vf-btn" data-movement="fifth_up">5th up</button>
                        <button class="vf-btn" data-movement="sixth_up">6th up</button>
                        <button class="vf-btn" data-movement="seventh_up">7th up</button>
                        <button class="vf-btn" data-movement="third_down">3rd down</button>
                        <button class="vf-btn" data-movement="fourth_down">4th down</button>
                        <button class="vf-btn" data-movement="fifth_down">5th down</button>
                        <button class="vf-btn" data-movement="sixth_down">6th down</button>
                        <button class="vf-btn" data-movement="seventh_down">7th down</button>
                    </div>
                </div>

                <div class="vf-row">
                    <div class="segment-row">
                        <span class="step-label">Repeat</span>
                        <button class="vf-btn" data-repeat="1">once</button>
                        <button class="vf-btn" data-repeat="2">twice</button>
                        <button class="vf-btn" data-repeat="Infinity">&#8734;</button>
                        <button class="vf-btn" data-repeat="Infinity-nogap">&#8734;+no gap</button>
                    </div>
                    <div class="segment-row">
                        <span class="step-label">Rising</span>
                        <button class="vf-btn" data-rising="0">off</button>
                        <button class="vf-btn" data-rising="1">half</button>
                        <button class="vf-btn" data-rising="2">whole</button>
                    </div>
                </div>

                <div class="vf-row">
                    <div class="segment-row">
                        <span class="step-label">Exercise</span>
                        <button class="vf-btn" data-exercise="none">full scale</button>
                        <button class="vf-btn" data-exercise="five_note">5-note</button>
                        <button class="vf-btn" data-exercise="octave_jump">octave jump</button>
                        <button class="vf-btn" data-exercise="arpeggio_return">arp return</button>
                        <button class="vf-btn" data-exercise="thirds">thirds</button>
                    </div>
                    <div class="segment-row">
                        <span class="step-label">Shifting</span>
                        <button class="vf-btn" data-shifting="0">off</button>
                        <button class="vf-btn" data-shifting="1">on</button>
                    </div>
                    <div class="segment-row">
                        <span class="step-label">Chop Head</span>
                        <button class="vf-btn" data-chop-head="0">off</button>
                        <button class="vf-btn" data-chop-head="1">on</button>
                    </div>
                </div>

                <!-- Ladder: overlapping rungs shifting one degree at a time
                     (1-2-3, 2-3-4, ...). Reverse leads each rung with the
                     new note (3-2-1, 4-3-2, ...). -->
                <div class="vf-row">
                    <div class="segment-row">
                        <span class="step-label">Ladder</span>
                        <button class="vf-btn" data-ladder="off">off</button>
                        <button class="vf-btn" data-ladder="on">on</button>
                        <button class="vf-btn" data-ladder="reverse">reverse</button>
                    </div>
                    <div class="step-field">
                        <span class="step-label">Rung Notes</span>
                        <button class="step-btn" type="button" data-step-key="ladderSize" data-step-delta="-1" aria-label="Fewer notes per rung">-</button>
                        <span class="step-value" id="ladderSizeValue">3</span>
                        <button class="step-btn" type="button" data-step-key="ladderSize" data-step-delta="1" aria-label="More notes per rung">+</button>
                    </div>
                    <div class="step-field">
                        <span class="step-label">Rung Gap</span>
                        <button class="step-btn" type="button" data-step-key="ladderGapMs" data-step-delta="-1" aria-label="Shorter gap between rungs">-</button>
                        <span class="step-value" id="ladderGapValue">0.5s</span>
                        <button class="step-btn" type="button" data-step-key="ladderGapMs" data-step-delta="1" aria-label="Longer gap between rungs">+</button>
                    </div>
                </div>

                <div class="vf-row">
                    <div class="segment-row">
                        <span class="step-label">Scale</span>
                        <button class="vf-btn" data-scale-type="major">major</button>
                        <button class="vf-btn" data-scale-type="minor">minor</button>
                        <button class="vf-btn" data-scale-type="chromatic">chromatic</button>
                        <button class="vf-btn" data-scale-type="pentatonic">pentatonic</button>
                        <button class="vf-btn" data-scale-type="harmonic_minor">harmonic minor</button>
                        <button class="vf-btn" data-scale-type="melodic_minor">melodic minor</button>
                        <button class="vf-btn" data-scale-type="quarter_tone">quarter tone</button>
                        <button class="vf-btn" data-scale-type="rast">rast</button>
                        <button class="vf-btn" data-scale-type="bayati">bayati</button>
                        <button class="vf-btn" data-scale-type="sikah">sikah</button>
                        <button class="vf-btn" data-scale-type="slendro">slendro</button>
                        <button class="vf-btn" data-scale-type="just_major">just major</button>
                    </div>
                </div>

                <div class="vf-row vf-row-reset">
                    <button id="resetBtn" class="panel-action-btn">Reset</button>
                    <button id="randomBtn" class="panel-action-btn">Random</button>
                </div>
            </div>

            <!-- Saved Configurations (Presets) -->
            <div class="command-history" id="presetHistory">
                <div class="history-header">
                    <h3>Saved Configs</h3>
                </div>
                <div class="preset-actions-row">
                    <input id="presetNameInput" class="text-input preset-name-input" type="text"
                        placeholder="Name this config (optional)" />
                    <button id="savePresetBtn" class="panel-action-btn" title="Save current settings">Save</button>
                    <button id="applyPresetBtn" class="panel-action-btn"
                        title="Apply selected config">Apply</button>
                    <button id="deletePresetBtn" class="panel-action-btn danger"
                        title="Delete selected config">Delete</button>
                </div>
                <div class="history-list" id="presetList">
                    <p class="history-empty">No saved configs yet</p>
                </div>
            </div>

            <!-- What played, newest first, each with a replay button -->
            <div class="command-history" id="commandHistory">
                <div class="history-header">
                    <h3>History</h3>
                    <div class="history-actions">
                        <button id="copyAllHistoryBtn" class="panel-action-btn" title="Copy all history">Copy
                            All</button>
                        <button id="clearHistoryBtn" class="panel-action-btn danger">Clear</button>
                    </div>
                </div>
                <div class="history-list" id="historyList">
                    <p class="history-empty">Nothing played yet</p>
                </div>
            </div>

            <footer class="page-footer">
                <button onclick="location.reload(true)" class="footer-btn">Hard Refresh</button>
                <a href="https://github.com/ernop/voice-wei" target="_blank" class="footer-link">GitHub</a>
            </footer>
        </main>
    </div>

    <aside class="pitch-test-dock" id="scalesSingDock" aria-label="Sing test">
        <div class="pitch-test-dock-bar">
            <button id="singBtn" class="pitch-test-launch-button" type="button" aria-label="Toggle sing test" aria-pressed="false">Sing</button>
            <span class="pitch-test-dock-hint">Sing the scale against the chart</span>
        </div>
        <section id="scalesSingPanel" hidden></section>
    </aside>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="dev-error-monitor.js?v=378"></script>
    <script src="fuseki-stats.js?v=378"></script>
    <script src="usage-stats.js?v=378"></script>
    <script src="app-version.js?v=378"></script>
    <script src="storage-keys.js?v=378"></script>
    <script src="audio-volume.js?v=378"></script>
    <script src="shared-header.js?v=378"></script>
    <script src="music-constants.js?v=378"></script>
    <script src="scales-patterns.js?v=378"></script>
    <script src="scales-playback.js?v=378"></script>
    <script src="piano-core.js?v=378"></script>
    <script src="piano-keyboard.js?v=378"></script>
    <script src="pitch-detect-core.js?v=378"></script>
    <script src="pitch-score.js?v=378"></script>
    <script src="pitch-trace-view.js?v=378"></script>
    <script src="render-throttle.js?v=378"></script>
    <script src="practice-controls.js?v=378"></script>
    <script src="history-list.js?v=378"></script>
    <script src="settings-store.js?v=378"></script>
    <script src="progress-store.js?v=378"></script>
    <script src="media-session-core.js?v=378"></script>
    <script src="pitch-test-panel.js?v=378"></script>
    <script src="scales.js?v=378"></script>
</body>

</html>
