<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Phrases - Voice-Wei</title>
    <link rel="stylesheet" href="style.css?v=52">
    <link rel="stylesheet" href="scales.css?v=52">
    <link rel="stylesheet" href="phrases.css?v=52">
</head>

<body data-page="phrases">
    <div class="container">
        <header id="siteHeader"></header>

        <main>
            <div class="voice-controls-row">
                <button id="stopBtn" class="stop-button" aria-label="Stop">
                    <span class="button-text">Stop</span>
                    <span class="button-icon">&#9632;</span>
                </button>
                <button id="playBtn" class="play-button" aria-label="Play phrase">
                    <span class="button-text">Play</span>
                    <span class="button-icon">&#9654;</span>
                </button>
                <button id="repeatBtn" class="play-button phrase-repeat-button" aria-label="Toggle phrase repeat" aria-pressed="false">
                    <span class="button-text">Repeat Off</span>
                    <span class="button-icon">&#8635;</span>
                </button>
                <button id="nextBtn" class="next-button" aria-label="Next phrase">
                    <span class="button-text">Next</span>
                    <span class="button-icon">&#9654;</span>
                </button>
            </div>

            <section class="phrase-stage" aria-live="polite">
                <div class="phrase-stage-label" id="phraseMeta">Press Play or Next to generate a phrase</div>
                <div class="phrase-degrees-large" id="phraseDegrees">--</div>
                <div class="phrase-note-toggles" id="phraseNoteToggles" aria-label="Active notes"></div>
                <div class="phrase-notes-line" id="phraseNotes"></div>
                <div class="phrase-stage-actions">
                    <button id="reflectBtn" class="phrase-stage-btn" type="button" aria-pressed="false">Reflect Off</button>
                    <button id="allNotesBtn" class="phrase-stage-btn" type="button">All Notes</button>
                </div>
                <div class="phrase-status" id="phraseStatus">Ready</div>
            </section>

            <div class="voice-first-ui phrase-controls">
                <div class="vf-row">
                    <span class="vf-label">Root</span>
                    <div class="vf-options">
                        <button class="vf-btn" data-root="C">C</button>
                        <button class="vf-btn vf-btn-sharp" data-root="C#">C#</button>
                        <button class="vf-btn" data-root="D">D</button>
                        <button class="vf-btn vf-btn-sharp" data-root="D#">D#</button>
                        <button class="vf-btn" data-root="E">E</button>
                        <button class="vf-btn" data-root="F">F</button>
                        <button class="vf-btn vf-btn-sharp" data-root="F#">F#</button>
                        <button class="vf-btn" data-root="G">G</button>
                        <button class="vf-btn vf-btn-sharp" data-root="G#">G#</button>
                        <button class="vf-btn" data-root="A">A</button>
                        <button class="vf-btn vf-btn-sharp" data-root="A#">A#</button>
                        <button class="vf-btn" data-root="B">B</button>
                    </div>
                    <span class="vf-label vf-label-inline">Octave</span>
                    <div class="vf-options">
                        <button class="vf-btn" data-octave="2">2</button>
                        <button class="vf-btn" data-octave="3">3</button>
                        <button class="vf-btn" data-octave="4">4</button>
                    </div>
                </div>

                <div class="vf-row">
                    <span class="vf-label">Scale</span>
                    <div class="vf-options">
                        <button class="vf-btn" data-scale="major">major</button>
                        <button class="vf-btn" data-scale="minor">minor</button>
                        <button class="vf-btn" data-scale="chromatic">chromatic</button>
                        <button class="vf-btn" data-scale="pentatonic">pentatonic</button>
                        <button class="vf-btn" data-scale="harmonic_minor">h minor</button>
                        <button class="vf-btn" data-scale="melodic_minor">m minor</button>
                    </div>
                </div>

                <div class="vf-row">
                    <span class="vf-label">Start</span>
                    <div class="vf-options">
                        <button class="vf-btn" data-start="one">start at 1</button>
                        <button class="vf-btn" data-start="random">random start</button>
                    </div>
                    <span class="vf-label vf-label-inline">Range</span>
                    <div class="vf-options">
                        <button class="vf-btn" data-range="within">within octave</button>
                        <button class="vf-btn" data-range="expanded">out of octave</button>
                    </div>
                </div>

                <div class="vf-row">
                    <span class="vf-label">Min Len</span>
                    <div class="vf-options phrase-length-options">
                        <button class="vf-btn" data-min-length="2">2</button>
                        <button class="vf-btn" data-min-length="3">3</button>
                        <button class="vf-btn" data-min-length="4">4</button>
                        <button class="vf-btn" data-min-length="5">5</button>
                        <button class="vf-btn" data-min-length="6">6</button>
                        <button class="vf-btn" data-min-length="7">7</button>
                        <button class="vf-btn" data-min-length="8">8</button>
                        <button class="vf-btn" data-min-length="9">9</button>
                        <button class="vf-btn" data-min-length="10">10</button>
                        <button class="vf-btn" data-min-length="12">12</button>
                        <button class="vf-btn" data-min-length="16">16</button>
                    </div>
                    <span class="vf-label vf-label-inline">Max Len</span>
                    <div class="vf-options phrase-length-options">
                        <button class="vf-btn" data-max-length="3">3</button>
                        <button class="vf-btn" data-max-length="4">4</button>
                        <button class="vf-btn" data-max-length="5">5</button>
                        <button class="vf-btn" data-max-length="6">6</button>
                        <button class="vf-btn" data-max-length="7">7</button>
                        <button class="vf-btn" data-max-length="8">8</button>
                        <button class="vf-btn" data-max-length="9">9</button>
                        <button class="vf-btn" data-max-length="10">10</button>
                        <button class="vf-btn" data-max-length="12">12</button>
                        <button class="vf-btn" data-max-length="16">16</button>
                        <button class="vf-btn" data-max-length="24">24</button>
                        <button class="vf-btn" data-max-length="32">32</button>
                        <button class="vf-btn" data-max-length="40">40</button>
                        <button class="vf-btn" data-max-length="50">50</button>
                    </div>
                </div>

                <div class="vf-row">
                    <span class="vf-label">Ending</span>
                    <div class="vf-options">
                        <label class="display-toggle">
                            <input type="checkbox" id="returnInitialToggle">
                            <span>Return initial note</span>
                        </label>
                        <label class="display-toggle">
                            <input type="checkbox" id="returnRootToggle">
                            <span>Return root</span>
                        </label>
                    </div>
                </div>

                <div class="vf-row">
                    <span class="vf-label">Output</span>
                    <div class="vf-options">
                        <button class="vf-btn" data-output="display">display</button>
                        <button class="vf-btn" data-output="speak">say numbers</button>
                        <button class="vf-btn" data-output="tones">play tones</button>
                        <button class="vf-btn" data-output="speak_tones">say + tones</button>
                        <button class="vf-btn" data-output="sing_numbers">sing numbers</button>
                    </div>
                </div>

                <div class="vf-row">
                    <span class="vf-label">Note Len</span>
                    <div class="vf-options">
                        <button class="vf-btn" data-length="300">0.3s</button>
                        <button class="vf-btn" data-length="600">0.6s</button>
                        <button class="vf-btn" data-length="900">0.9s</button>
                        <button class="vf-btn" data-length="1200">1.2s</button>
                        <button class="vf-btn" data-length="1600">1.6s</button>
                    </div>
                    <span class="vf-label vf-label-inline">Gap</span>
                    <div class="vf-options">
                        <button class="vf-btn" data-gap="0">0s</button>
                        <button class="vf-btn" data-gap="100">0.1s</button>
                        <button class="vf-btn" data-gap="250">0.25s</button>
                        <button class="vf-btn" data-gap="500">0.5s</button>
                    </div>
                </div>

                <div class="vf-row">
                    <span class="vf-label">Display</span>
                    <div class="vf-options">
                        <label class="display-toggle">
                            <input type="checkbox" id="showNamesToggle" checked>
                            <span>Show note names</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="command-history">
                <div class="history-header">
                    <h3>Phrase History</h3>
                    <button id="clearHistoryBtn" class="clear-history-btn">Clear</button>
                </div>
                <div class="history-list" id="historyList">
                    <p class="history-empty">No phrases yet</p>
                </div>
            </div>

            <footer class="page-footer">
                <button onclick="location.reload(true)" class="footer-btn">Hard Refresh</button>
                <a href="https://github.com/ernop/voice-wei" target="_blank" class="footer-link">GitHub</a>
            </footer>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="shared-header.js?v=52"></script>
    <script src="music-constants.js?v=52"></script>
    <script src="voice-output.js?v=52"></script>
    <script src="pattern-practice-core.js?v=52"></script>
    <script src="phrases.js?v=52"></script>
</body>

</html>
