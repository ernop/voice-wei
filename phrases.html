<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Phrases - Voice-Wei</title>
    <link rel="stylesheet" href="style.css?v=89">
    <link rel="stylesheet" href="practice-controls.css?v=89">
    <link rel="stylesheet" href="phrases.css?v=89">
</head>

<body data-page="phrases">
    <div class="container">
        <header id="siteHeader"></header>

        <main>
            <div class="voice-controls-row">
                <button id="stopBtn" class="stop-button" aria-label="Stop">
                    <span class="button-text">Stop</span>
                    <span class="button-icon">&#9632;</span>
                </button>
                <button id="playBtn" class="play-button" aria-label="Play phrase">
                    <span class="button-text">Play</span>
                    <span class="button-icon">&#9654;</span>
                </button>
                <button id="repeatBtn" class="play-button phrase-repeat-button" aria-label="Toggle phrase repeat" aria-pressed="false">
                    <span class="button-text">Repeat Off</span>
                    <span class="button-icon">&#8635;</span>
                </button>
                <button id="testBtn" class="play-button pitch-test-launch-button" aria-label="Test phrase pitch">
                    <span class="button-text">Test</span>
                    <span class="button-icon">&#9835;</span>
                </button>
                <button id="nextBtn" class="next-button" aria-label="Next phrase">
                    <span class="button-text">Next</span>
                    <span class="button-icon">&#9654;</span>
                </button>
            </div>

            <section class="phrase-stage" aria-live="polite">
                <div class="phrase-degrees-large" id="phraseDegrees">--</div>
                <div class="phrase-notes-line" id="phraseNotes"></div>
                <div class="phrase-stage-actions">
                    <button id="reflectBtn" class="phrase-stage-btn" type="button" aria-pressed="false">Reflect Off</button>
                    <button id="allNotesBtn" class="phrase-stage-btn" type="button">All Notes</button>
                </div>
            </section>

            <section id="phraseTestPanel" aria-label="Phrase pitch test" hidden></section>

            <div class="voice-first-ui phrase-controls phrase-control-grid">
                <section class="phrase-control-card phrase-control-card-timing">
                    <div class="step-field">
                        <span class="step-label">Note Len</span>
                        <button class="step-btn" type="button" data-step-key="noteLengthMs" data-step-delta="-1" aria-label="Shorter note length">-</button>
                        <span class="step-value" id="noteLengthValue">0.3s</span>
                        <button class="step-btn" type="button" data-step-key="noteLengthMs" data-step-delta="1" aria-label="Longer note length">+</button>
                    </div>
                    <div class="step-field">
                        <span class="step-label">Gap</span>
                        <button class="step-btn" type="button" data-step-key="gapMs" data-step-delta="-1" aria-label="Shorter gap">-</button>
                        <span class="step-value" id="gapValue">0s</span>
                        <button class="step-btn" type="button" data-step-key="gapMs" data-step-delta="1" aria-label="Longer gap">+</button>
                    </div>
                </section>

                <section class="phrase-control-card phrase-control-card-key">
                    <div class="step-field phrase-pitch-step-field">
                        <span class="step-label">Root</span>
                        <button class="step-btn" type="button" data-step-key="rootPitch" data-step-delta="-1" aria-label="Lower root pitch">-</button>
                        <span class="step-value" id="rootPitchValue">D#3</span>
                        <button class="step-btn" type="button" data-step-key="rootPitch" data-step-delta="1" aria-label="Higher root pitch">+</button>
                    </div>
                </section>

                <section class="phrase-control-card phrase-control-card-shape">
                    <div class="segment-row">
                        <button class="vf-btn" data-start="one">start at 1</button>
                        <button class="vf-btn" data-start="random">random start</button>
                    </div>
                    <div class="segment-row">
                        <button class="vf-btn" data-range="within">in octave</button>
                        <button class="vf-btn" data-range="over">just over</button>
                        <button class="vf-btn" data-range="expanded">out octave</button>
                    </div>
                    <div class="phrase-length-adjusters">
                        <div class="step-field">
                            <span class="step-label">Min</span>
                            <button class="step-btn" type="button" data-step-key="minLength" data-step-delta="-1" aria-label="Shorter minimum phrase length">-</button>
                            <span class="step-value" id="minLengthValue">5</span>
                            <button class="step-btn" type="button" data-step-key="minLength" data-step-delta="1" aria-label="Longer minimum phrase length">+</button>
                        </div>
                        <div class="step-field">
                            <span class="step-label">Max</span>
                            <button class="step-btn" type="button" data-step-key="maxLength" data-step-delta="-1" aria-label="Shorter maximum phrase length">-</button>
                            <span class="step-value" id="maxLengthValue">8</span>
                            <button class="step-btn" type="button" data-step-key="maxLength" data-step-delta="1" aria-label="Longer maximum phrase length">+</button>
                        </div>
                    </div>
                    <div class="segment-row">
                        <button class="vf-btn" data-return-initial="yes">return to 1</button>
                        <button class="vf-btn" data-return-initial="no">no return</button>
                    </div>
                    <div class="phrase-toggle-row">
                        <label class="display-toggle">
                            <input type="checkbox" id="showNamesToggle" checked>
                            <span>Show names</span>
                        </label>
                    </div>
                </section>

                <section class="phrase-control-card phrase-control-card-output">
                    <div class="phrase-button-row">
                        <button class="vf-btn" data-output="display">display</button>
                        <button class="vf-btn" data-output="speak">say numbers</button>
                        <button class="vf-btn" data-output="tones">play tones</button>
                        <button class="vf-btn" data-output="speak_tones">say + tones</button>
                        <button class="vf-btn" data-output="sing_numbers">sing numbers</button>
                        <button class="vf-btn" data-output="none">none</button>
                    </div>
                </section>

                <section class="phrase-control-card phrase-control-card-scale">
                    <div class="phrase-button-row phrase-scale-row">
                        <button class="vf-btn" data-scale="major">major</button>
                        <button class="vf-btn" data-scale="minor">minor</button>
                        <button class="vf-btn" data-scale="chromatic">chromatic</button>
                        <button class="vf-btn" data-scale="pentatonic">pentatonic</button>
                        <button class="vf-btn" data-scale="harmonic_minor">h minor</button>
                        <button class="vf-btn" data-scale="melodic_minor">m minor</button>
                    </div>
                </section>
            </div>

            <div class="command-history">
                <div class="history-header">
                    <h3>Phrase History</h3>
                    <button id="clearHistoryBtn" class="clear-history-btn">Clear</button>
                </div>
                <div class="history-list" id="historyList">
                    <p class="history-empty">No phrases yet</p>
                </div>
            </div>

            <footer class="page-footer">
                <button onclick="location.reload(true)" class="footer-btn">Hard Refresh</button>
                <a href="https://github.com/ernop/voice-wei" target="_blank" class="footer-link">GitHub</a>
            </footer>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="shared-header.js?v=89"></script>
    <script src="music-constants.js?v=89"></script>
    <script src="voice-output.js?v=89"></script>
    <script src="pattern-practice-core.js?v=89"></script>
    <script src="piano-core.js?v=89"></script>
    <script src="pitch-detect-core.js?v=89"></script>
    <script src="pitch-trace-view.js?v=89"></script>
    <script src="practice-controls.js?v=89"></script>
    <script src="settings-store.js?v=89"></script>
    <script src="progress-store.js?v=89"></script>
    <script src="media-session-core.js?v=89"></script>
    <script src="pitch-test-panel.js?v=89"></script>
    <script src="phrases.js?v=89"></script>
</body>

</html>
