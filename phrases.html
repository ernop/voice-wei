<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Phrases - Voice-Wei</title>
    <link rel="stylesheet" href="style.css?v=141">
    <link rel="stylesheet" href="practice-controls.css?v=141">
    <link rel="stylesheet" href="phrases.css?v=141">
</head>

<body data-page="phrases">
    <div class="container">
        <header id="siteHeader"></header>

        <main>
            <div class="voice-controls-row">
                <button id="stopBtn" class="stop-button" aria-label="Stop">
                    <span class="button-text">Stop</span>
                    <span class="button-icon">&#9632;</span>
                </button>
                <button id="playBtn" class="play-button" aria-label="Play phrase">
                    <span class="button-text">Play</span>
                    <span class="button-icon">&#9654;</span>
                </button>
                <button id="repeatBtn" class="repeat-button" aria-label="Toggle phrase repeat" aria-pressed="false">
                    <span class="button-text">Repeat Off</span>
                    <span class="button-icon">&#8635;</span>
                </button>
                <button id="testBtn" class="play-button pitch-test-launch-button" aria-label="Toggle phrase pitch test" aria-pressed="false">
                    <span class="button-text">Test</span>
                    <span class="button-icon">&#9835;</span>
                </button>
                <button id="nextBtn" class="next-button" aria-label="Next phrase">
                    <span class="button-text">Next</span>
                    <span class="button-icon">&#9654;</span>
                </button>
            </div>

            <section class="phrase-stage" aria-live="polite">
                <div class="phrase-degrees-large" id="phraseDegrees">--</div>
                <div class="phrase-staff phrase-staff-empty" id="phraseStaff" aria-label="Staff notation"></div>
                <div class="phrase-stage-meta">
                    <div class="phrase-notes-line" id="phraseNotes"></div>
                    <div class="phrase-stage-actions">
                        <button id="allNotesBtn" class="phrase-stage-btn" type="button">All Notes</button>
                        <button id="addNoteBtn" class="phrase-stage-btn" type="button" hidden>add note</button>
                        <button id="breakdownBtn" class="phrase-stage-btn" type="button" aria-pressed="false">breakdown</button>
                        <button id="autoStepBtn" class="phrase-stage-btn" type="button" aria-pressed="false">auto step</button>
                        <button id="playOnStepBtn" class="phrase-stage-btn" type="button" aria-pressed="false">play on step</button>
                        <button id="reflectBtn" class="phrase-stage-btn" type="button" aria-pressed="false">Reflect Off</button>
                    </div>
                </div>
            </section>

            <section id="phraseTestPanel" aria-label="Phrase pitch test" hidden></section>

            <div class="voice-first-ui phrase-controls phrase-control-grid">
                <!-- All numeric choosers live together in one row -->
                <section class="phrase-control-card phrase-control-card-numbers">
                    <div class="step-field">
                        <span class="step-label">Note Len</span>
                        <button class="step-btn" type="button" data-step-key="noteLengthMs" data-step-delta="-1" aria-label="Shorter note length">-</button>
                        <span class="step-value" id="noteLengthValue">0.3s</span>
                        <button class="step-btn" type="button" data-step-key="noteLengthMs" data-step-delta="1" aria-label="Longer note length">+</button>
                    </div>
                    <div class="step-field">
                        <span class="step-label">Gap</span>
                        <button class="step-btn" type="button" data-step-key="gapMs" data-step-delta="-1" aria-label="Shorter gap">-</button>
                        <span class="step-value" id="gapValue">0s</span>
                        <button class="step-btn" type="button" data-step-key="gapMs" data-step-delta="1" aria-label="Longer gap">+</button>
                    </div>
                    <div class="step-field phrase-pitch-step-field">
                        <span class="step-label">Root</span>
                        <button class="step-btn" type="button" data-step-key="rootPitch" data-step-delta="-1" aria-label="Lower root pitch">-</button>
                        <span class="step-value" id="rootPitchValue">D#3</span>
                        <button class="step-btn" type="button" data-step-key="rootPitch" data-step-delta="1" aria-label="Higher root pitch">+</button>
                    </div>
                    <div class="step-field phrase-length-step-field">
                        <span class="step-label">Min</span>
                        <button class="step-btn" type="button" data-step-key="minLength" data-step-delta="-1" aria-label="Shorter minimum phrase length">-</button>
                        <span class="step-value" id="minLengthValue">5</span>
                        <button class="step-btn" type="button" data-step-key="minLength" data-step-delta="1" aria-label="Longer minimum phrase length">+</button>
                    </div>
                    <div class="step-field phrase-length-step-field">
                        <span class="step-label">Max</span>
                        <button class="step-btn" type="button" data-step-key="maxLength" data-step-delta="-1" aria-label="Shorter maximum phrase length">-</button>
                        <span class="step-value" id="maxLengthValue">8</span>
                        <button class="step-btn" type="button" data-step-key="maxLength" data-step-delta="1" aria-label="Longer maximum phrase length">+</button>
                    </div>
                    <div class="step-field phrase-accidental-step-field"
                        title="Chance of choosing a chromatic passing note between adjacent scale degrees">
                        <span class="step-label">Pass Note</span>
                        <button class="step-btn" type="button" data-step-key="accidentalRate" data-step-delta="-1" aria-label="Lower passing-note rate">-</button>
                        <span class="step-value" id="accidentalRateValue">0%</span>
                        <button class="step-btn" type="button" data-step-key="accidentalRate" data-step-delta="1" aria-label="Higher passing-note rate">+</button>
                    </div>
                </section>

                <!-- Option groups: every group sits in its own segment shell -->
                <section class="phrase-control-card phrase-control-card-shape">
                    <div class="segment-row phrase-style-row">
                        <button class="vf-btn" data-phrase-style="free" title="Use the older free-form motion algorithms">free</button>
                        <button class="vf-btn" data-phrase-style="staff" title="Beginner staff-reading patterns: steps, skips, and landmarks">staff read</button>
                        <button class="vf-btn" data-phrase-style="sight" title="Progressive vocal sight-singing degree sets">sight sing</button>
                        <button class="vf-btn" data-phrase-style="barbershop" title="Chord-tone and function drills for barbershop singing">barbershop</button>
                        <button class="vf-btn" data-phrase-style="genre" title="Genre-flavored melodic studies">genre</button>
                    </div>
                    <div class="segment-row phrase-lesson-row" data-lesson-family="staff">
                        <button class="vf-btn" data-phrase-lesson="staff_steps" title="Line-space stepwise staff reading">staff steps</button>
                        <button class="vf-btn" data-phrase-lesson="staff_skips" title="Line-line / space-space third motion">staff skips</button>
                        <button class="vf-btn" data-phrase-lesson="staff_mixed" title="Small staff-reading step and skip mix">staff mixed</button>
                        <button class="vf-btn" data-phrase-lesson="staff_landmarks" title="Landmark and chord-anchor note reading">landmarks</button>
                    </div>
                    <div class="segment-row phrase-lesson-row" data-lesson-family="sight">
                        <button class="vf-btn" data-phrase-lesson="sight_do_re" title="Movable-do 1 and 2 only">1-2</button>
                        <button class="vf-btn" data-phrase-lesson="sight_pentachord" title="Degrees 1-5, mostly close motion">pentachord</button>
                        <button class="vf-btn" data-phrase-lesson="sight_triad" title="Tonic-triad sight singing">triad</button>
                        <button class="vf-btn" data-phrase-lesson="sight_cadence" title="Short phrase endings that pull back to 1">cadence</button>
                    </div>
                    <div class="segment-row phrase-lesson-row" data-lesson-family="barbershop">
                        <button class="vf-btn" data-phrase-lesson="barber_tonic" title="Barbershop tonic chord tones: 1, 3, 5, 8">bs tonic</button>
                        <button class="vf-btn" data-phrase-lesson="barber_dominant" title="Dominant function: 5, 7, 2, 4">bs dominant</button>
                        <button class="vf-btn" data-phrase-lesson="barber_subdominant" title="Subdominant function: 4, 6, 1">bs subdom</button>
                        <button class="vf-btn" data-phrase-lesson="barber_thirds" title="Practice finding and returning to thirds">bs 3rds</button>
                        <button class="vf-btn" data-phrase-lesson="barber_sevenths" title="Practice dominant seventh chord members">bs 7ths</button>
                    </div>
                    <div class="segment-row phrase-lesson-row phrase-genre-row" data-lesson-family="genre">
                        <button class="vf-btn" data-phrase-lesson="genre_folk_hymn" title="Stepwise folk/hymn-style diatonic lines">folk/hymn</button>
                        <button class="vf-btn" data-phrase-lesson="genre_pop_hook" title="Short pentatonic pop-hook shapes">pop hook</button>
                        <button class="vf-btn" data-phrase-lesson="genre_theatre" title="Wider musical-theatre-style phrase arcs">theatre</button>
                        <button class="vf-btn" data-phrase-lesson="genre_jazz" title="Chord-aware jazz-standard color tones">jazz</button>
                        <button class="vf-btn" data-phrase-lesson="genre_gospel" title="Pentatonic gospel/soul turns">gospel</button>
                        <button class="vf-btn" data-phrase-lesson="genre_classical" title="Small classical sequence patterns">classical</button>
                        <button class="vf-btn" data-phrase-lesson="genre_blackbird_folk" title="Abstract fingerpicked folk arpeggio contours, not a melody copy">blackbird-ish</button>
                        <button class="vf-btn" data-phrase-lesson="genre_hello_pop" title="Abstract compact Beatles-style call/answer hook contours">hello-ish</button>
                        <button class="vf-btn" data-phrase-lesson="genre_simon_folk" title="Abstract Simon/Garfunkel-style step-and-third folk contours">S&G folk</button>
                        <button class="vf-btn" data-phrase-lesson="genre_scarborough_modal" title="Abstract modal folk contour study">modal folk</button>
                        <button class="vf-btn" data-phrase-lesson="genre_calypso" title="Bright triad-and-sixth calypso shapes">calypso</button>
                        <button class="vf-btn" data-phrase-lesson="genre_norteno" title="Thirds-forward norteño-style motion">norteño</button>
                        <button class="vf-btn" data-phrase-lesson="genre_cantopop" title="Gentle pentatonic cantopop-style contours">cantopop</button>
                        <button class="vf-btn" data-phrase-lesson="genre_klezmer" title="Harmonic-minor klezmer color">klezmer</button>
                        <button class="vf-btn" data-phrase-lesson="genre_modal" title="Modal/minor color studies">modal</button>
                    </div>
                    <div class="segment-row phrase-anchor-row">
                        <button class="vf-btn" data-start-anchor="one">start at 1</button>
                        <button class="vf-btn" data-start-anchor="random">random start</button>
                    </div>
                    <div class="segment-row phrase-anchor-row">
                        <button class="vf-btn" data-return-anchor="on" id="returnAnchorOnBtn">return to 1</button>
                        <button class="vf-btn" data-return-anchor="off">no return</button>
                    </div>
                    <div class="segment-row">
                        <button class="vf-btn" data-range="within">in octave</button>
                        <button class="vf-btn" data-range="over">just over</button>
                        <button class="vf-btn" data-range="expanded">out octave</button>
                    </div>
                    <div class="segment-row phrase-algo-row">
                        <button class="vf-btn" data-phrase-algo="balanced" title="Mixed contour with local motion and occasional leaps">balanced</button>
                        <button class="vf-btn" data-phrase-algo="random" title="Uniform random notes inside the selected range">random</button>
                        <button class="vf-btn" data-phrase-algo="stepwise" title="Mostly conjunct motion by neighboring scale degrees">stepwise</button>
                        <button class="vf-btn" data-phrase-algo="leapy" title="Disjunct motion with contrary step compensation">leapy</button>
                        <button class="vf-btn" data-phrase-algo="arch" title="Phrase-level rise-and-fall contour">arch</button>
                        <button class="vf-btn" data-phrase-algo="motif" title="One short interval shape restated from moving anchors">motif</button>
                        <button class="vf-btn" data-phrase-algo="alto_gaps" title="Alto gap work around 3-4 and 7-8">alto gaps</button>
                    </div>
                    <div class="vf-options">
                        <label class="display-toggle">
                            <input type="checkbox" id="showNumbersToggle" checked>
                            <span>Show numbers</span>
                        </label>
                        <label class="display-toggle">
                            <input type="checkbox" id="showNamesToggle" checked>
                            <span>Show names</span>
                        </label>
                        <label class="display-toggle">
                            <input type="checkbox" id="showStaffToggle" checked>
                            <span>Show staff</span>
                        </label>
                        <label class="display-toggle">
                            <input type="checkbox" id="showPlayRowToggle" checked>
                            <span>Tap notes</span>
                        </label>
                        <button id="fillFullBtn" class="vf-btn phrase-toggle-btn" type="button" aria-pressed="false"
                            title="Play invisible scale runs between adjacent enabled phrase notes">full fill</button>
                        <button id="fillChordBtn" class="vf-btn phrase-toggle-btn" type="button" aria-pressed="false"
                            title="Fill invisible 1-3-5-8 paths between adjacent enabled phrase notes">1358 fill</button>
                    </div>
                </section>

                <section class="phrase-control-card phrase-control-card-output">
                    <div class="vf-options phrase-hear-options">
                        <label class="display-toggle">
                            <input type="checkbox" id="hearTonesToggle" checked>
                            <span>hear tones</span>
                        </label>
                        <label class="display-toggle">
                            <input type="checkbox" id="hearSpeechToggle">
                            <span>say numbers</span>
                        </label>
                        <label class="display-toggle">
                            <input type="checkbox" id="singNumbersToggle">
                            <span>sing numbers</span>
                        </label>
                    </div>
                </section>

                <section class="phrase-control-card phrase-control-card-scale">
                    <div class="segment-row phrase-scale-row">
                        <button class="vf-btn" data-scale="major">major</button>
                        <button class="vf-btn" data-scale="minor">minor</button>
                        <button class="vf-btn" data-scale="chromatic">chromatic</button>
                        <button class="vf-btn" data-scale="pentatonic">pentatonic</button>
                        <button class="vf-btn" data-scale="harmonic_minor">h minor</button>
                        <button class="vf-btn" data-scale="melodic_minor">m minor</button>
                    </div>
                </section>
            </div>

            <div class="command-history">
                <div class="history-header">
                    <h3>Phrase History</h3>
                    <button id="clearHistoryBtn" class="panel-action-btn danger">Clear</button>
                </div>
                <div class="history-list" id="historyList">
                    <p class="history-empty">No phrases yet</p>
                </div>
            </div>

            <footer class="page-footer">
                <button onclick="location.reload(true)" class="footer-btn">Hard Refresh</button>
                <a href="https://github.com/ernop/voice-wei" target="_blank" class="footer-link">GitHub</a>
            </footer>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vexflow/3.0.9/vexflow-min.js"></script>
    <script src="dev-error-monitor.js?v=141"></script>
    <script src="app-version.js?v=141"></script>
    <script src="storage-keys.js?v=141"></script>
    <script src="shared-header.js?v=141"></script>
    <script src="music-constants.js?v=141"></script>
    <script src="voice-output.js?v=141"></script>
    <script src="pattern-practice-core.js?v=141"></script>
    <script src="piano-core.js?v=141"></script>
    <script src="pitch-detect-core.js?v=141"></script>
    <script src="pitch-trace-view.js?v=141"></script>
    <script src="practice-controls.js?v=141"></script>
    <script src="history-list.js?v=141"></script>
    <script src="settings-store.js?v=141"></script>
    <script src="progress-store.js?v=141"></script>
    <script src="media-session-core.js?v=141"></script>
    <script src="notation-spelling.js?v=141"></script>
    <script src="staff-view.js?v=141"></script>
    <script src="pitch-test-panel.js?v=141"></script>
    <script src="phrases.js?v=141"></script>
</body>

</html>
