<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Phrases - Voice-Wei</title>
    <link rel="stylesheet" href="style.css?v=61">
    <link rel="stylesheet" href="scales.css?v=61">
    <link rel="stylesheet" href="phrases.css?v=61">
</head>

<body data-page="phrases">
    <div class="container">
        <header id="siteHeader"></header>

        <main>
            <div class="voice-controls-row">
                <button id="stopBtn" class="stop-button" aria-label="Stop">
                    <span class="button-text">Stop</span>
                    <span class="button-icon">&#9632;</span>
                </button>
                <button id="playBtn" class="play-button" aria-label="Play phrase">
                    <span class="button-text">Play</span>
                    <span class="button-icon">&#9654;</span>
                </button>
                <button id="repeatBtn" class="play-button phrase-repeat-button" aria-label="Toggle phrase repeat" aria-pressed="false">
                    <span class="button-text">Repeat Off</span>
                    <span class="button-icon">&#8635;</span>
                </button>
                <button id="nextBtn" class="next-button" aria-label="Next phrase">
                    <span class="button-text">Next</span>
                    <span class="button-icon">&#9654;</span>
                </button>
            </div>

            <section class="phrase-stage" aria-live="polite">
                <div class="phrase-stage-label" id="phraseMeta">Press Play or Next to generate a phrase</div>
                <div class="phrase-degrees-large" id="phraseDegrees">--</div>
                <div class="phrase-note-toggles" id="phraseNoteToggles" aria-label="Active notes"></div>
                <div class="phrase-notes-line" id="phraseNotes"></div>
                <div class="phrase-stage-actions">
                    <button id="reflectBtn" class="phrase-stage-btn" type="button" aria-pressed="false">Reflect Off</button>
                    <button id="allNotesBtn" class="phrase-stage-btn" type="button">All Notes</button>
                </div>
                <div class="phrase-status" id="phraseStatus">Ready</div>
            </section>

            <div class="voice-first-ui phrase-controls phrase-control-grid">
                <section class="phrase-control-card phrase-control-card-timing">
                    <div class="phrase-control-card-title">Timing</div>
                    <div class="phrase-step-field">
                        <span class="phrase-step-label">Note Len</span>
                        <button class="phrase-step-btn" type="button" data-step-key="noteLengthMs" data-step-delta="-1" aria-label="Shorter note length">-</button>
                        <span class="phrase-step-value" id="noteLengthValue">0.3s</span>
                        <button class="phrase-step-btn" type="button" data-step-key="noteLengthMs" data-step-delta="1" aria-label="Longer note length">+</button>
                    </div>
                    <div class="phrase-preset-row" aria-label="Note length presets">
                        <button class="vf-btn" data-preset-key="noteLengthMs" data-preset-value="200">fast</button>
                        <button class="vf-btn" data-preset-key="noteLengthMs" data-preset-value="300">default</button>
                        <button class="vf-btn" data-preset-key="noteLengthMs" data-preset-value="600">steady</button>
                        <button class="vf-btn" data-preset-key="noteLengthMs" data-preset-value="1200">slow</button>
                    </div>
                    <div class="phrase-step-field">
                        <span class="phrase-step-label">Gap</span>
                        <button class="phrase-step-btn" type="button" data-step-key="gapMs" data-step-delta="-1" aria-label="Shorter gap">-</button>
                        <span class="phrase-step-value" id="gapValue">0s</span>
                        <button class="phrase-step-btn" type="button" data-step-key="gapMs" data-step-delta="1" aria-label="Longer gap">+</button>
                    </div>
                    <div class="phrase-preset-row" aria-label="Gap presets">
                        <button class="vf-btn" data-preset-key="gapMs" data-preset-value="0">none</button>
                        <button class="vf-btn" data-preset-key="gapMs" data-preset-value="100">tiny</button>
                        <button class="vf-btn" data-preset-key="gapMs" data-preset-value="250">clear</button>
                        <button class="vf-btn" data-preset-key="gapMs" data-preset-value="500">wide</button>
                    </div>
                </section>

                <section class="phrase-control-card phrase-control-card-key">
                    <div class="phrase-control-card-title">Key</div>
                    <div class="phrase-key-picker" aria-label="Root note">
                        <button class="vf-btn" data-root="C">C</button>
                        <button class="vf-btn vf-btn-sharp" data-root="C#">C#</button>
                        <button class="vf-btn" data-root="D">D</button>
                        <button class="vf-btn vf-btn-sharp" data-root="D#">D#</button>
                        <button class="vf-btn" data-root="E">E</button>
                        <button class="vf-btn" data-root="F">F</button>
                        <button class="vf-btn vf-btn-sharp" data-root="F#">F#</button>
                        <button class="vf-btn" data-root="G">G</button>
                        <button class="vf-btn vf-btn-sharp" data-root="G#">G#</button>
                        <button class="vf-btn" data-root="A">A</button>
                        <button class="vf-btn vf-btn-sharp" data-root="A#">A#</button>
                        <button class="vf-btn" data-root="B">B</button>
                    </div>
                    <div class="phrase-compact-fields phrase-key-fields">
                        <div class="phrase-step-field">
                            <span class="phrase-step-label">Octave</span>
                            <button class="phrase-step-btn" type="button" data-step-key="octave" data-step-delta="-1" aria-label="Lower octave">-</button>
                            <span class="phrase-step-value" id="octaveValue">3</span>
                            <button class="phrase-step-btn" type="button" data-step-key="octave" data-step-delta="1" aria-label="Higher octave">+</button>
                        </div>
                        <div class="phrase-preset-row" aria-label="Octave presets">
                            <button class="vf-btn" data-preset-key="octave" data-preset-value="2">low</button>
                            <button class="vf-btn" data-preset-key="octave" data-preset-value="3">mid</button>
                            <button class="vf-btn" data-preset-key="octave" data-preset-value="4">high</button>
                        </div>
                    </div>
                    <div class="phrase-button-row phrase-scale-row">
                        <button class="vf-btn" data-scale="major">major</button>
                        <button class="vf-btn" data-scale="minor">minor</button>
                        <button class="vf-btn" data-scale="chromatic">chromatic</button>
                        <button class="vf-btn" data-scale="pentatonic">pentatonic</button>
                        <button class="vf-btn" data-scale="harmonic_minor">h minor</button>
                        <button class="vf-btn" data-scale="melodic_minor">m minor</button>
                    </div>
                </section>

                <section class="phrase-control-card phrase-control-card-shape">
                    <div class="phrase-control-card-title">Phrase</div>
                    <div class="phrase-button-row">
                        <button class="vf-btn" data-start="one">start at 1</button>
                        <button class="vf-btn" data-start="random">random start</button>
                        <button class="vf-btn" data-range="within">within octave</button>
                        <button class="vf-btn" data-range="expanded">out of octave</button>
                    </div>
                    <div class="phrase-length-adjusters">
                        <div class="phrase-step-field">
                            <span class="phrase-step-label">Min</span>
                            <button class="phrase-step-btn" type="button" data-step-key="minLength" data-step-delta="-1" aria-label="Shorter minimum phrase length">-</button>
                            <span class="phrase-step-value" id="minLengthValue">5</span>
                            <button class="phrase-step-btn" type="button" data-step-key="minLength" data-step-delta="1" aria-label="Longer minimum phrase length">+</button>
                        </div>
                        <div class="phrase-step-field">
                            <span class="phrase-step-label">Max</span>
                            <button class="phrase-step-btn" type="button" data-step-key="maxLength" data-step-delta="-1" aria-label="Shorter maximum phrase length">-</button>
                            <span class="phrase-step-value" id="maxLengthValue">10</span>
                            <button class="phrase-step-btn" type="button" data-step-key="maxLength" data-step-delta="1" aria-label="Longer maximum phrase length">+</button>
                        </div>
                    </div>
                    <div class="phrase-preset-row" aria-label="Phrase length presets">
                        <button class="vf-btn" data-length-range-min="2" data-length-range-max="5">short</button>
                        <button class="vf-btn" data-length-range-min="5" data-length-range-max="10">default</button>
                        <button class="vf-btn" data-length-range-min="8" data-length-range-max="16">long</button>
                        <button class="vf-btn" data-length-range-min="16" data-length-range-max="50">huge</button>
                    </div>
                    <div class="phrase-toggle-row">
                        <label class="display-toggle">
                            <input type="checkbox" id="returnInitialToggle">
                            <span>Return initial</span>
                        </label>
                        <label class="display-toggle">
                            <input type="checkbox" id="returnRootToggle">
                            <span>Return root</span>
                        </label>
                        <label class="display-toggle">
                            <input type="checkbox" id="showNamesToggle" checked>
                            <span>Show names</span>
                        </label>
                    </div>
                </section>

                <section class="phrase-control-card phrase-control-card-output">
                    <div class="phrase-control-card-title">Output</div>
                    <div class="phrase-button-row">
                        <button class="vf-btn" data-output="display">display</button>
                        <button class="vf-btn" data-output="speak">say numbers</button>
                        <button class="vf-btn" data-output="tones">play tones</button>
                        <button class="vf-btn" data-output="speak_tones">say + tones</button>
                        <button class="vf-btn" data-output="sing_numbers">sing numbers</button>
                    </div>
                </section>
            </div>

            <div class="command-history">
                <div class="history-header">
                    <h3>Phrase History</h3>
                    <button id="clearHistoryBtn" class="clear-history-btn">Clear</button>
                </div>
                <div class="history-list" id="historyList">
                    <p class="history-empty">No phrases yet</p>
                </div>
            </div>

            <footer class="page-footer">
                <button onclick="location.reload(true)" class="footer-btn">Hard Refresh</button>
                <a href="https://github.com/ernop/voice-wei" target="_blank" class="footer-link">GitHub</a>
            </footer>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="shared-header.js?v=61"></script>
    <script src="music-constants.js?v=61"></script>
    <script src="voice-output.js?v=61"></script>
    <script src="pattern-practice-core.js?v=61"></script>
    <script src="phrases.js?v=61"></script>
</body>

</html>
