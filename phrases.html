<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Phrases - Voice-Wei</title>
    <link rel="stylesheet" href="style.css?v=58">
    <link rel="stylesheet" href="scales.css?v=58">
    <link rel="stylesheet" href="phrases.css?v=58">
</head>

<body data-page="phrases">
    <div class="container">
        <header id="siteHeader"></header>

        <main>
            <div class="voice-controls-row">
                <button id="stopBtn" class="stop-button" aria-label="Stop">
                    <span class="button-text">Stop</span>
                    <span class="button-icon">&#9632;</span>
                </button>
                <button id="playBtn" class="play-button" aria-label="Play phrase">
                    <span class="button-text">Play</span>
                    <span class="button-icon">&#9654;</span>
                </button>
                <button id="repeatBtn" class="play-button phrase-repeat-button" aria-label="Toggle phrase repeat" aria-pressed="false">
                    <span class="button-text">Repeat Off</span>
                    <span class="button-icon">&#8635;</span>
                </button>
                <button id="testBtn" class="play-button phrase-test-button" aria-label="Test phrase pitch">
                    <span class="button-text">Test</span>
                    <span class="button-icon">&#9835;</span>
                </button>
                <button id="nextBtn" class="next-button" aria-label="Next phrase">
                    <span class="button-text">Next</span>
                    <span class="button-icon">&#9654;</span>
                </button>
            </div>

            <section class="phrase-stage" aria-live="polite">
                <div class="phrase-stage-label" id="phraseMeta">Press Play or Next to generate a phrase</div>
                <div class="phrase-degrees-large" id="phraseDegrees">--</div>
                <div class="phrase-note-toggles" id="phraseNoteToggles" aria-label="Active notes"></div>
                <div class="phrase-notes-line" id="phraseNotes"></div>
                <div class="phrase-stage-actions">
                    <button id="reflectBtn" class="phrase-stage-btn" type="button" aria-pressed="false">Reflect Off</button>
                    <button id="allNotesBtn" class="phrase-stage-btn" type="button">All Notes</button>
                </div>
                <div class="phrase-status" id="phraseStatus">Ready</div>
            </section>

            <section class="phrase-test-panel" id="phraseTestPanel" aria-label="Phrase pitch test" hidden>
                <div class="phrase-test-header">
                    <div>
                        <h2>Phrase Test</h2>
                        <p id="phraseTestSubtitle">Match the target phrase while your pitch draws left to right.</p>
                    </div>
                    <div class="phrase-test-actions">
                        <button id="phraseTestRestartBtn" class="phrase-stage-btn" type="button">Restart</button>
                        <button id="phraseTestListenBtn" class="phrase-stage-btn" type="button" aria-pressed="true">Listening On</button>
                        <button id="phraseTestTargetsBtn" class="phrase-stage-btn selected" type="button" aria-pressed="true">Targets On</button>
                    </div>
                </div>
                <div class="phrase-test-readout" aria-live="polite">
                    <span id="phraseTestPitch">Pitch: --</span>
                    <span id="phraseTestCents">-- cents</span>
                    <span id="phraseTestStatus">Ready</span>
                </div>
                <div class="phrase-test-canvas-wrap">
                    <canvas id="phraseTestCanvas"></canvas>
                </div>
                <div class="phrase-test-legend">
                    <span><i class="legend-target"></i> target phrase</span>
                    <span><i class="legend-sung"></i> sung pitch</span>
                    <span><i class="legend-scale"></i> scale degree rails</span>
                </div>
            </section>

            <div class="voice-first-ui phrase-controls phrase-control-grid">
                <section class="phrase-control-card phrase-control-card-timing">
                    <div class="phrase-control-card-title">Timing</div>
                    <div class="phrase-compact-fields">
                        <label class="phrase-select-field">
                            <span>Note Len</span>
                            <select id="noteLengthSelect">
                                <option value="200">0.2s</option>
                                <option value="250">0.25s</option>
                                <option value="300">0.3s</option>
                                <option value="350">0.35s</option>
                                <option value="400">0.4s</option>
                                <option value="450">0.45s</option>
                                <option value="500">0.5s</option>
                                <option value="600">0.6s</option>
                                <option value="900">0.9s</option>
                                <option value="1200">1.2s</option>
                                <option value="1600">1.6s</option>
                            </select>
                        </label>
                        <label class="phrase-select-field">
                            <span>Gap</span>
                            <select id="gapSelect">
                                <option value="0">0s</option>
                                <option value="100">0.1s</option>
                                <option value="250">0.25s</option>
                                <option value="500">0.5s</option>
                            </select>
                        </label>
                    </div>
                </section>

                <section class="phrase-control-card phrase-control-card-key">
                    <div class="phrase-control-card-title">Key</div>
                    <div class="phrase-key-picker" aria-label="Root note">
                        <button class="vf-btn" data-root="C">C</button>
                        <button class="vf-btn vf-btn-sharp" data-root="C#">C#</button>
                        <button class="vf-btn" data-root="D">D</button>
                        <button class="vf-btn vf-btn-sharp" data-root="D#">D#</button>
                        <button class="vf-btn" data-root="E">E</button>
                        <button class="vf-btn" data-root="F">F</button>
                        <button class="vf-btn vf-btn-sharp" data-root="F#">F#</button>
                        <button class="vf-btn" data-root="G">G</button>
                        <button class="vf-btn vf-btn-sharp" data-root="G#">G#</button>
                        <button class="vf-btn" data-root="A">A</button>
                        <button class="vf-btn vf-btn-sharp" data-root="A#">A#</button>
                        <button class="vf-btn" data-root="B">B</button>
                    </div>
                    <div class="phrase-compact-fields phrase-key-fields">
                        <label class="phrase-select-field">
                            <span>Octave</span>
                            <select id="octaveSelect">
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                            </select>
                        </label>
                    </div>
                    <div class="phrase-button-row phrase-scale-row">
                        <button class="vf-btn" data-scale="major">major</button>
                        <button class="vf-btn" data-scale="minor">minor</button>
                        <button class="vf-btn" data-scale="chromatic">chromatic</button>
                        <button class="vf-btn" data-scale="pentatonic">pentatonic</button>
                        <button class="vf-btn" data-scale="harmonic_minor">h minor</button>
                        <button class="vf-btn" data-scale="melodic_minor">m minor</button>
                    </div>
                </section>

                <section class="phrase-control-card phrase-control-card-shape">
                    <div class="phrase-control-card-title">Phrase</div>
                    <div class="phrase-button-row">
                        <button class="vf-btn" data-start="one">start at 1</button>
                        <button class="vf-btn" data-start="random">random start</button>
                        <button class="vf-btn" data-range="within">within octave</button>
                        <button class="vf-btn" data-range="expanded">out of octave</button>
                    </div>
                    <div class="phrase-length-pair">
                        <span>Length</span>
                        <select id="minLengthSelect" aria-label="Minimum phrase length">
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                            <option value="12">12</option>
                            <option value="16">16</option>
                        </select>
                        <span>to</span>
                        <select id="maxLengthSelect" aria-label="Maximum phrase length">
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                            <option value="12">12</option>
                            <option value="16">16</option>
                            <option value="24">24</option>
                            <option value="32">32</option>
                            <option value="40">40</option>
                            <option value="50">50</option>
                        </select>
                    </div>
                    <div class="phrase-toggle-row">
                        <label class="display-toggle">
                            <input type="checkbox" id="returnInitialToggle">
                            <span>Return initial</span>
                        </label>
                        <label class="display-toggle">
                            <input type="checkbox" id="returnRootToggle">
                            <span>Return root</span>
                        </label>
                        <label class="display-toggle">
                            <input type="checkbox" id="showNamesToggle" checked>
                            <span>Show names</span>
                        </label>
                    </div>
                </section>

                <section class="phrase-control-card phrase-control-card-output">
                    <div class="phrase-control-card-title">Output</div>
                    <div class="phrase-button-row">
                        <button class="vf-btn" data-output="display">display</button>
                        <button class="vf-btn" data-output="speak">say numbers</button>
                        <button class="vf-btn" data-output="tones">play tones</button>
                        <button class="vf-btn" data-output="speak_tones">say + tones</button>
                        <button class="vf-btn" data-output="sing_numbers">sing numbers</button>
                    </div>
                </section>
            </div>

            <div class="command-history">
                <div class="history-header">
                    <h3>Phrase History</h3>
                    <button id="clearHistoryBtn" class="clear-history-btn">Clear</button>
                </div>
                <div class="history-list" id="historyList">
                    <p class="history-empty">No phrases yet</p>
                </div>
            </div>

            <footer class="page-footer">
                <button onclick="location.reload(true)" class="footer-btn">Hard Refresh</button>
                <a href="https://github.com/ernop/voice-wei" target="_blank" class="footer-link">GitHub</a>
            </footer>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="shared-header.js?v=58"></script>
    <script src="music-constants.js?v=58"></script>
    <script src="voice-output.js?v=58"></script>
    <script src="pattern-practice-core.js?v=58"></script>
    <script src="phrases.js?v=58"></script>
</body>

</html>
