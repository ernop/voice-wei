<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4ade80"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#14b8a6"/>
    </marker>
  </defs>

  <rect width="900" height="680" rx="12" fill="#0d2818"/>

  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#a7f3d0">CURRENT PIPELINE: Search to Playback</text>

  <!-- Voice Input -->
  <rect x="40" y="60" width="180" height="50" rx="25" fill="#22c55e" opacity="0.85"/>
  <text x="130" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#0d2818">Voice (Web Speech API)</text>

  <!-- Typed Input -->
  <rect x="240" y="60" width="180" height="50" rx="25" fill="#14b8a6" opacity="0.85"/>
  <text x="330" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Typed Command</text>

  <!-- Arrows down from inputs -->
  <line x1="130" y1="110" x2="400" y2="155" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="110" x2="400" y2="155" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Control command check -->
  <rect x="320" y="155" width="160" height="40" rx="8" fill="none" stroke="#facc15" stroke-width="1.5"/>
  <text x="400" y="180" text-anchor="middle" font-size="12" fill="#facc15">Control command?</text>

  <!-- Control path -->
  <line x1="480" y1="175" x2="600" y2="175" stroke="#facc15" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <rect x="600" y="155" width="140" height="40" rx="8" fill="rgba(250,204,21,0.15)" stroke="#facc15" stroke-width="1"/>
  <text x="670" y="180" text-anchor="middle" font-size="12" fill="#facc15">Execute locally</text>
  <text x="670" y="195" text-anchor="middle" font-size="10" fill="#888">(play/pause/next/etc)</text>

  <!-- Music search path -->
  <line x1="400" y1="195" x2="400" y2="230" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Claude API -->
  <rect x="300" y="230" width="200" height="50" rx="10" fill="rgba(74,222,128,0.15)" stroke="#4ade80" stroke-width="1.5"/>
  <text x="400" y="252" text-anchor="middle" font-size="13" font-weight="600" fill="#a7f3d0">Claude API</text>
  <text x="400" y="268" text-anchor="middle" font-size="10" fill="#86efac">Interpret music request</text>

  <line x1="400" y1="280" x2="400" y2="310" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- JSON song list -->
  <rect x="300" y="310" width="200" height="45" rx="10" fill="rgba(255,255,255,0.08)" stroke="#86efac" stroke-width="1"/>
  <text x="400" y="330" text-anchor="middle" font-size="12" fill="#e8f5e9">JSON Song List</text>
  <text x="400" y="345" text-anchor="middle" font-size="10" fill="#888">{name, artist, year, album, searchTerm}</text>

  <line x1="400" y1="355" x2="400" y2="385" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- For-each loop -->
  <rect x="280" y="385" width="240" height="40" rx="8" fill="none" stroke="#86efac" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="400" y="410" text-anchor="middle" font-size="12" fill="#86efac">For each song in list:</text>

  <line x1="400" y1="425" x2="400" y2="455" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- YouTube Search via Proxy -->
  <rect x="280" y="455" width="240" height="50" rx="10" fill="rgba(239,68,68,0.12)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="400" y="477" text-anchor="middle" font-size="13" font-weight="600" fill="#fca5a5">proxy.php (Piped/Invidious)</text>
  <text x="400" y="493" text-anchor="middle" font-size="10" fill="#888">YouTube search, no API key</text>

  <line x1="400" y1="505" x2="400" y2="535" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Playlist Item -->
  <rect x="280" y="535" width="240" height="45" rx="10" fill="rgba(74,222,128,0.12)" stroke="#4ade80" stroke-width="1.5"/>
  <text x="400" y="555" text-anchor="middle" font-size="12" font-weight="600" fill="#a7f3d0">Playlist Item Created</text>
  <text x="400" y="568" text-anchor="middle" font-size="10" fill="#888">videoId, title, artist, duration</text>

  <!-- Two paths from playlist item -->
  <line x1="340" y1="580" x2="200" y2="615" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="580" x2="660" y2="615" stroke="#14b8a6" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <!-- YouTube IFrame Player -->
  <rect x="100" y="615" width="200" height="50" rx="10" fill="rgba(239,68,68,0.12)" stroke="#ef4444" stroke-width="1"/>
  <text x="200" y="637" text-anchor="middle" font-size="12" font-weight="600" fill="#fca5a5">YT IFrame Player</text>
  <text x="200" y="652" text-anchor="middle" font-size="10" fill="#888">Hidden until play clicked</text>

  <!-- Lyrics (LRCLIB) -->
  <rect x="570" y="615" width="200" height="50" rx="10" fill="rgba(20,184,166,0.15)" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="670" y="637" text-anchor="middle" font-size="12" font-weight="600" fill="#99f6e4">LRCLIB API</text>
  <text x="670" y="652" text-anchor="middle" font-size="10" fill="#888">Lyrics lookup (on play or click)</text>

  <!-- Legend -->
  <rect x="580" y="60" width="280" height="80" rx="8" fill="rgba(0,0,0,0.3)"/>
  <text x="590" y="80" font-size="11" font-weight="600" fill="#a7f3d0">Legend:</text>
  <circle cx="600" cy="95" r="4" fill="#4ade80"/>
  <text x="612" y="99" font-size="10" fill="#86efac">Main pipeline flow</text>
  <circle cx="600" cy="112" r="4" fill="#14b8a6"/>
  <text x="612" y="116" font-size="10" fill="#99f6e4">Lyrics path (lazy/async)</text>
  <circle cx="600" cy="129" r="4" fill="#facc15"/>
  <text x="612" y="133" font-size="10" fill="#facc15">Control command shortcut</text>
</svg>
