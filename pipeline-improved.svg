<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4ade80"/>
    </marker>
    <marker id="arr-teal" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#14b8a6"/>
    </marker>
    <marker id="arr-yellow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#facc15"/>
    </marker>
    <marker id="arr-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="900" height="780" rx="12" fill="#0d2818"/>

  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#facc15">IMPROVED / POTENTIAL PIPELINE</text>

  <!-- Voice Input -->
  <rect x="40" y="60" width="180" height="50" rx="25" fill="#22c55e" opacity="0.85"/>
  <text x="130" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#0d2818">Voice (Web Speech API)</text>

  <!-- Typed Input -->
  <rect x="240" y="60" width="180" height="50" rx="25" fill="#14b8a6" opacity="0.85"/>
  <text x="330" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Typed Command</text>

  <!-- Arrows down from inputs -->
  <line x1="130" y1="110" x2="400" y2="150" stroke="#4ade80" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="330" y1="110" x2="400" y2="150" stroke="#4ade80" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Claude API with enriched output -->
  <rect x="280" y="150" width="240" height="55" rx="10" fill="rgba(74,222,128,0.15)" stroke="#4ade80" stroke-width="1.5"/>
  <text x="400" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#a7f3d0">Claude API (Enhanced)</text>
  <text x="400" y="190" text-anchor="middle" font-size="10" fill="#86efac">Could return LRCLIB IDs, Spotify IDs, MBIDs</text>

  <line x1="400" y1="205" x2="400" y2="235" stroke="#4ade80" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Enriched Song List -->
  <rect x="260" y="235" width="280" height="50" rx="10" fill="rgba(255,255,255,0.08)" stroke="#86efac" stroke-width="1"/>
  <text x="400" y="255" text-anchor="middle" font-size="12" fill="#e8f5e9">Enriched Song List</text>
  <text x="400" y="270" text-anchor="middle" font-size="10" fill="#888">{name, artist, year, album, searchTerm, lrclibHint, mbid}</text>

  <line x1="400" y1="285" x2="400" y2="310" stroke="#4ade80" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Parallel fan-out -->
  <rect x="300" y="310" width="200" height="30" rx="8" fill="none" stroke="#86efac" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="400" y="330" text-anchor="middle" font-size="12" fill="#86efac">For each song (parallel):</text>

  <!-- Three parallel paths -->
  <line x1="300" y1="340" x2="130" y2="380" stroke="#4ade80" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="400" y1="340" x2="400" y2="380" stroke="#14b8a6" stroke-width="2" marker-end="url(#arr-teal)"/>
  <line x1="500" y1="340" x2="700" y2="380" stroke="#c084fc" stroke-width="2" marker-end="url(#arr-purple)"/>

  <!-- YouTube Search -->
  <rect x="30" y="380" width="200" height="50" rx="10" fill="rgba(239,68,68,0.12)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="130" y="402" text-anchor="middle" font-size="12" font-weight="600" fill="#fca5a5">YouTube Search</text>
  <text x="130" y="418" text-anchor="middle" font-size="10" fill="#888">proxy.php (Piped/Invidious)</text>

  <!-- Lyrics Pre-fetch -->
  <rect x="280" y="380" width="240" height="50" rx="10" fill="rgba(20,184,166,0.15)" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="400" y="402" text-anchor="middle" font-size="12" font-weight="600" fill="#99f6e4">LRCLIB Pre-fetch</text>
  <text x="400" y="418" text-anchor="middle" font-size="10" fill="#888">Lyrics fetched immediately, not on play</text>

  <!-- Metadata enrichment -->
  <rect x="580" y="380" width="240" height="50" rx="10" fill="rgba(192,132,252,0.12)" stroke="#c084fc" stroke-width="1.5"/>
  <text x="700" y="402" text-anchor="middle" font-size="12" font-weight="600" fill="#c084fc">MusicBrainz / Spotify</text>
  <text x="700" y="418" text-anchor="middle" font-size="10" fill="#888">Accurate metadata (POTENTIAL)</text>

  <!-- Converge -->
  <line x1="130" y1="430" x2="400" y2="470" stroke="#4ade80" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="400" y1="430" x2="400" y2="470" stroke="#14b8a6" stroke-width="2" marker-end="url(#arr-teal)"/>
  <line x1="700" y1="430" x2="400" y2="470" stroke="#c084fc" stroke-width="2" marker-end="url(#arr-purple)"/>

  <!-- Playlist Item (enriched) -->
  <rect x="260" y="470" width="280" height="50" rx="10" fill="rgba(74,222,128,0.12)" stroke="#4ade80" stroke-width="1.5"/>
  <text x="400" y="490" text-anchor="middle" font-size="12" font-weight="600" fill="#a7f3d0">Playlist Item (Enriched)</text>
  <text x="400" y="505" text-anchor="middle" font-size="10" fill="#888">videoId + lyrics pre-loaded + metadata</text>

  <line x1="400" y1="520" x2="400" y2="550" stroke="#4ade80" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Playback -->
  <rect x="280" y="550" width="240" height="50" rx="10" fill="rgba(239,68,68,0.12)" stroke="#ef4444" stroke-width="1"/>
  <text x="400" y="572" text-anchor="middle" font-size="13" font-weight="600" fill="#fca5a5">YT IFrame Player</text>
  <text x="400" y="588" text-anchor="middle" font-size="10" fill="#888">Instant playback, lyrics ready</text>

  <!-- Synced lyrics display -->
  <line x1="400" y1="600" x2="400" y2="630" stroke="#14b8a6" stroke-width="2" marker-end="url(#arr-teal)"/>

  <rect x="260" y="630" width="280" height="50" rx="10" fill="rgba(20,184,166,0.15)" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="400" y="650" text-anchor="middle" font-size="12" font-weight="600" fill="#99f6e4">Synced Lyrics Display</text>
  <text x="400" y="665" text-anchor="middle" font-size="10" fill="#888">Real-time highlight, Big Lyrics overlay</text>

  <!-- Improvements callout box -->
  <rect x="30" y="700" width="840" height="70" rx="10" fill="rgba(250,204,21,0.08)" stroke="#facc15" stroke-width="1"/>
  <text x="450" y="720" text-anchor="middle" font-size="12" font-weight="700" fill="#facc15">KEY IMPROVEMENTS OVER CURRENT</text>
  <text x="450" y="738" text-anchor="middle" font-size="11" fill="#e8f5e9">1. Parallel YouTube + Lyrics fetch (no lazy loading delay)  2. Claude could hint LRCLIB IDs for better match rates</text>
  <text x="450" y="754" text-anchor="middle" font-size="11" fill="#e8f5e9">3. MusicBrainz/Spotify for accurate metadata  4. Lyrics status known before play (shown in playlist row)</text>

  <!-- Legend -->
  <rect x="600" y="60" width="260" height="95" rx="8" fill="rgba(0,0,0,0.3)"/>
  <text x="610" y="80" font-size="11" font-weight="600" fill="#a7f3d0">Legend:</text>
  <circle cx="620" cy="95" r="4" fill="#4ade80"/>
  <text x="632" y="99" font-size="10" fill="#86efac">Main pipeline</text>
  <circle cx="620" cy="112" r="4" fill="#14b8a6"/>
  <text x="632" y="116" font-size="10" fill="#99f6e4">Lyrics path (eager in improved)</text>
  <circle cx="620" cy="129" r="4" fill="#c084fc"/>
  <text x="632" y="133" font-size="10" fill="#c084fc">Metadata enrichment (potential)</text>
  <circle cx="620" cy="146" r="4" fill="#facc15"/>
  <text x="632" y="150" font-size="10" fill="#facc15">Improvement annotations</text>
</svg>
