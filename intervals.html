<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Intervals - Voice-Wei</title>
    <link rel="stylesheet" href="style.css?v=99">
    <link rel="stylesheet" href="practice-controls.css?v=99">
    <link rel="stylesheet" href="intervals.css?v=99">
</head>

<body data-page="intervals">
    <div class="container">
        <header id="siteHeader"></header>

        <main>
            <!-- Transport controls -->
            <div class="voice-controls-row">
                <button id="stopBtn" class="stop-button" aria-label="Stop">
                    <span class="button-text">Stop</span>
                    <span class="button-icon">&#9632;</span>
                </button>
                <button id="playBtn" class="play-button" aria-label="Play">
                    <span class="button-text">Go</span>
                    <span class="button-icon">&#9654;</span>
                </button>
                <button id="nextBtn" class="next-button" aria-label="Next">
                    <span class="button-text">Next</span>
                    <span class="button-icon">&#9197;</span>
                </button>
                <button id="singBtn" class="play-button pitch-test-launch-button" aria-label="Open sing test">
                    <span class="button-text">Sing</span>
                    <span class="button-icon">&#9835;</span>
                </button>
            </div>

            <!-- Current pattern display -->
            <div class="pattern-display-card">
                <div id="currentDisplay" class="pattern-display">
                    Press Go to start
                </div>
            </div>

            <section id="intervalsSingPanel" aria-label="Sing test" hidden></section>

            <!-- Settings (canonical order: timing, root, shape, output, scale) -->
            <div class="voice-first-ui">

                <!-- Note length / gap between patterns -->
                <div class="vf-row">
                    <span class="vf-label">Note Len</span>
                    <div class="vf-options">
                        <div class="step-field step-field-bare">
                            <button class="step-btn" type="button" data-step-key="lengthMs" data-step-delta="-1" aria-label="Shorter note length">-</button>
                            <span class="step-value" id="lengthValue">0.6s</span>
                            <button class="step-btn" type="button" data-step-key="lengthMs" data-step-delta="1" aria-label="Longer note length">+</button>
                        </div>
                    </div>
                    <span class="vf-label vf-label-inline">Gap</span>
                    <div class="vf-options">
                        <div class="step-field step-field-bare">
                            <button class="step-btn" type="button" data-step-key="gapMs" data-step-delta="-1" aria-label="Smaller gap">-</button>
                            <span class="step-value" id="gapValue">2s</span>
                            <button class="step-btn" type="button" data-step-key="gapMs" data-step-delta="1" aria-label="Larger gap">+</button>
                        </div>
                    </div>
                </div>

                <!-- Root / Octave -->
                <div class="vf-row">
                    <span class="vf-label">Root</span>
                    <div class="vf-options">
                        <div class="step-field step-field-bare">
                            <button class="step-btn" type="button" data-step-key="rootPitch" data-step-delta="-1" aria-label="Lower root pitch">-</button>
                            <span class="step-value" id="rootPitchValue">C4</span>
                            <button class="step-btn" type="button" data-step-key="rootPitch" data-step-delta="1" aria-label="Higher root pitch">+</button>
                        </div>
                    </div>
                </div>

                <!-- Exercise type -->
                <div class="vf-row">
                    <span class="vf-label">Type</span>
                    <div class="vf-options">
                        <div class="segment-row">
                            <button class="vf-btn" data-type="A">Degrees (1-4-5)</button>
                            <button class="vf-btn" data-type="B">Clusters (+2 -3)</button>
                        </div>
                    </div>
                </div>

                <!-- Level selection -->
                <div class="vf-row">
                    <span class="vf-label">Level</span>
                    <div class="vf-options" id="levelOptions">
                        <!-- Filled by JS -->
                    </div>
                </div>

                <!-- Toggles -->
                <div class="vf-row">
                    <span class="vf-label">Options</span>
                    <div class="vf-options">
                        <label class="display-toggle">
                            <input type="checkbox" id="toggleSpeak" checked>
                            <span>Speak numbers</span>
                        </label>
                        <label class="display-toggle">
                            <input type="checkbox" id="togglePlayNotes" checked>
                            <span>Play notes</span>
                        </label>
                        <label class="display-toggle">
                            <input type="checkbox" id="toggleShowNames" checked>
                            <span>Show note names</span>
                        </label>
                        <label class="display-toggle">
                            <input type="checkbox" id="toggleExpandRange">
                            <span>Expand range</span>
                        </label>
                        <label class="display-toggle">
                            <input type="checkbox" id="toggleReverse">
                            <span>Reverse</span>
                        </label>
                        <label class="display-toggle">
                            <input type="checkbox" id="toggleRepeat">
                            <span>Repeat</span>
                        </label>
                    </div>
                </div>

                <!-- Scale type -->
                <div class="vf-row">
                    <span class="vf-label">Scale</span>
                    <div class="vf-options">
                        <button class="vf-btn" data-scale="major">major</button>
                        <button class="vf-btn" data-scale="minor">minor</button>
                        <button class="vf-btn" data-scale="chromatic">chromatic</button>
                        <button class="vf-btn" data-scale="pentatonic">pentatonic</button>
                        <button class="vf-btn" data-scale="harmonic_minor">h minor</button>
                        <button class="vf-btn" data-scale="melodic_minor">m minor</button>
                    </div>
                </div>
            </div>

            <!-- History log -->
            <div class="command-history">
                <div class="history-header">
                    <h3>Pattern History</h3>
                    <button id="clearHistoryBtn" class="panel-action-btn danger">Clear</button>
                </div>
                <div class="history-list" id="historyList">
                    <p class="history-empty">No patterns yet</p>
                </div>
            </div>

            <footer class="page-footer">
                <button onclick="location.reload(true)" class="footer-btn">Hard Refresh</button>
                <a href="https://github.com/ernop/voice-wei" target="_blank" class="footer-link">GitHub</a>
            </footer>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="shared-header.js?v=99"></script>
    <script src="music-constants.js?v=99"></script>
    <script src="voice-output.js?v=99"></script>
    <script src="pattern-practice-core.js?v=99"></script>
    <script src="piano-core.js?v=99"></script>
    <script src="pitch-detect-core.js?v=99"></script>
    <script src="pitch-trace-view.js?v=99"></script>
    <script src="practice-controls.js?v=99"></script>
    <script src="history-list.js?v=99"></script>
    <script src="settings-store.js?v=99"></script>
    <script src="progress-store.js?v=99"></script>
    <script src="media-session-core.js?v=99"></script>
    <script src="pitch-test-panel.js?v=99"></script>
    <script src="intervals.js?v=99"></script>
</body>

</html>
