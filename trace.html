<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Trace - Voice-Wei</title>
    <link rel="stylesheet" href="style.css?v=216">
    <link rel="stylesheet" href="practice-controls.css?v=216">
    <link rel="stylesheet" href="trace.css?v=216">
</head>

<body data-page="trace">
    <div class="container">
        <header id="siteHeader"></header>

        <main>
            <section class="trace-hero">
                <div>
                    <h2>Key pitch trace</h2>
                    <p>Start singing and watch your voice move through the current key. Type a degree pattern to add guide targets.</p>
                </div>
                <div class="trace-actions">
                    <button id="startBtn" class="play-button" type="button">Start</button>
                    <button id="resetBtn" class="secondary-btn" type="button">Reset</button>
                </div>
            </section>

            <section class="trace-pattern-card">
                <label for="patternInput">Pattern guides</label>
                <input id="patternInput" class="text-input" type="text" inputmode="text" autocomplete="off" placeholder="1 2 3 5 3 1">
                <div class="trace-pattern-help">Use scale degrees like 1 2 3 4 5 6 7 8. Separators can be spaces, commas, or dashes.</div>
                <label class="display-toggle trace-play-toggle">
                    <input type="checkbox" id="playGuidesToggle">
                    <span>Play guide on reset</span>
                </label>
            </section>

            <section class="trace-readout" aria-live="polite">
                <span id="pitchReadout">Pitch: --</span>
                <span id="statusReadout">Ready</span>
            </section>

            <section class="trace-chart-wrap" aria-label="Pitch trace chart">
                <canvas id="traceCanvas"></canvas>
            </section>

            <section class="trace-compact-controls">
                <div class="step-field">
                    <span class="step-label">Interval</span>
                    <button class="step-btn" type="button" data-step-key="guideIntervalMs" data-step-delta="-1" aria-label="Shorter guide interval">-</button>
                    <span class="step-value" id="guideIntervalValue">1s</span>
                    <button class="step-btn" type="button" data-step-key="guideIntervalMs" data-step-delta="1" aria-label="Longer guide interval">+</button>
                </div>
                <div class="step-field">
                    <span class="step-label">Root</span>
                    <button class="step-btn" type="button" data-step-key="rootPitch" data-step-delta="-1" aria-label="Lower root pitch">-</button>
                    <span class="step-value" id="rootPitchValue">D#3</span>
                    <button class="step-btn" type="button" data-step-key="rootPitch" data-step-delta="1" aria-label="Higher root pitch">+</button>
                </div>
                <div class="vf-options">
                    <label class="display-toggle">
                        <input type="checkbox" id="pauseOnSilenceToggle" checked>
                        <span>Pause on silence</span>
                    </label>
                    <label class="display-toggle">
                        <input type="checkbox" id="fixedWindowToggle">
                        <span>20s window</span>
                    </label>
                    <label class="display-toggle">
                        <input type="checkbox" id="expandRangeToggle">
                        <span>Expand range</span>
                    </label>
                </div>
                <div class="vf-options trace-scale-row" aria-label="Guide sound">
                    <button class="vf-btn" data-guide-sound="piano">piano guides</button>
                    <button class="vf-btn" data-guide-sound="beep">beep guides</button>
                </div>
                <div class="vf-options trace-scale-row">
                    <button class="vf-btn" data-scale="major">major</button>
                    <button class="vf-btn" data-scale="minor">minor</button>
                    <button class="vf-btn" data-scale="chromatic">chromatic</button>
                    <button class="vf-btn" data-scale="pentatonic">pentatonic</button>
                    <button class="vf-btn" data-scale="harmonic_minor">h minor</button>
                    <button class="vf-btn" data-scale="melodic_minor">m minor</button>
                </div>
            </section>

            <footer class="page-footer">
                <button onclick="location.reload(true)" class="footer-btn">Hard Refresh</button>
                <a href="https://github.com/ernop/voice-wei" target="_blank" class="footer-link">GitHub</a>
            </footer>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="dev-error-monitor.js?v=216"></script>
    <script src="app-version.js?v=216"></script>
    <script src="storage-keys.js?v=216"></script>
    <script src="shared-header.js?v=216"></script>
    <script src="music-constants.js?v=216"></script>
    <script src="piano-core.js?v=216"></script>
    <script src="pitch-detect-core.js?v=216"></script>
    <script src="pitch-trace-view.js?v=216"></script>
    <script src="render-throttle.js?v=216"></script>
    <script src="practice-controls.js?v=216"></script>
    <script src="settings-store.js?v=216"></script>
    <script src="trace.js?v=216"></script>
</body>

</html>
